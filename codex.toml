# codex.toml — SpecNative configuration for Codex CLI
# Generated by SpecNative installer. Edit as needed.
# Docs: spec-native/.specnative/MCP.md

[mcp_servers.specnative]
command = "./.specnative/.venv/bin/python3"
args    = ["./.specnative/specnative_mcp.py"]
type    = "stdio"

# ---------------------------------------------------------------------------
# Custom prompts — invoke with: codex --prompt spec-init
# ---------------------------------------------------------------------------

[prompts.spec-init]
description = "Initialize SpecNative — guided project setup"
prompt = """
You are helping a developer set up SpecNative for their project.

Use the specnative MCP server:
1. Call health_check() to see which spec-native/ documents are empty or missing.
2. Explain SpecNative in 1-2 lines: "Your repo is the context. No more explaining the project in every session."
3. Interview the developer with these questions (wait for each answer):
   - What problem does this project solve?
   - Who are the users? What is their main pain?
   - What is the measurable success goal?
   - What is explicitly out of scope?
   - What is the tech stack? (language, framework, database)
   - How is the system structured? (main modules)
   - Coding conventions? (naming, testing, commits)
   - Main dev/test/build commands?
4. Use refine_document() to fill:
   spec-native/PRODUCT.md, STACK.md, ARCHITECTURE.md, CONVENTIONS.md, COMMANDS.md
5. Confirm what was written and suggest: "Next step: use spec-update or start_initiative."
"""

[prompts.spec-update]
description = "Update SpecNative docs — detect gaps, refine iteratively"
prompt = """
Use the specnative MCP server:
1. Call health_check() — show the full report to the developer.
2. Call suggest_next() — show the top 3 recommended actions.
3. Ask: "What do you want to work on today?"
   a) Fill detected gaps
   b) Update a specific document (which one?)
   c) Start a new spec for an initiative
4. Based on the answer:
   a) Ask targeted questions for each gap, use refine_document() to update.
   b) Read the doc with read_context(), ask what changed, update with refine_document().
   c) Guide through start_initiative() prompt.
5. Run health_check() again to confirm improvement.
"""

[prompts.spec-status]
description = "Quick SpecNative project health check"
prompt = """
Use the specnative MCP server:
1. Call resume() — check for active work from another agent.
2. Call status() — show active specs and task counts.
3. Call health_check() — show documentation alerts.
4. Summarize in 5 lines: what's healthy, what needs attention, most urgent action.
"""

[prompts.spec-handoff]
description = "Generate structured handoff for next agent"
prompt = """
Use the specnative MCP server to generate a handoff for the next agent.
1. Call status() and resume() to see current state.
2. Ask: what are you working on? what's the next step? any unrecorded decisions?
3. Call checkpoint() with the gathered info.
4. If there are unrecorded decisions, call log_decision() for each.
5. Confirm: read_context('session') and show SESSION.md to the developer.
6. Confirm: "Handoff ready. Next agent can call resume() to continue."
"""

[prompts.spec]
description = "Enruta una solicitud por el flujo mínimo de SpecNative."
prompt = """
Solicitud: la solicitud del desarrollador

Usa el MCP de SpecNative. Lee AGENTS.md, llama resume() y status(), y elige el flujo mínimo correcto: start_initiative, capture_backlog, plan_tasks, implement_task, record_decision, record_architecture, record_convention, review_against_spec, close_initiative o checkpoint. No edites índices ni tableros generados.
"""

[prompts.spec-backlog]
description = "Muestra el tablero o captura una solicitud como tarea o idea."
prompt = """
Argumentos: la solicitud del desarrollador

Usa el MCP de SpecNative. Si no hay argumentos, llama board() y muestra el tablero derivado. Si hay una solicitud, llama list_specs() y board(); usa capture_backlog_item() con iniciativa solo si existe una spec y se proporcionan criterio de cierre y validación. En otro caso registra una idea en intake. No edites tableros generados.
"""

[prompts.spec-backlog-add]
description = "Alias compatible de spec-backlog para capturar una solicitud."
prompt = """
Este es un alias compatible de spec-backlog. Usa los argumentos proporcionados para capturar una tarea canónica o una idea triada siguiendo el flujo spec-backlog. No edites tableros generados.
"""

[prompts.spec-decision]
description = "Registra una decisión persistente revisada."
prompt = """
Solicitud: la solicitud del desarrollador

Usa el MCP de SpecNative. Consulta list_decisions() y el contexto de arquitectura relacionado para evitar duplicados o contradicciones. Obtén contexto, decisión, consecuencias, tags y relaciones. Presenta un borrador y, tras confirmación, usa log_decision(). No registres detalles temporales de implementación.
"""

[prompts.spec-plan]
description = "Convierte una spec aprobada en tareas verificables."
prompt = """
Iniciativa: la solicitud del desarrollador

Usa el prompt MCP plan_tasks para la iniciativa indicada. Lee la spec, decisiones y arquitectura; presenta las tareas con dependencias, criterio de cierre y validación antes de guardarlas.
"""

[prompts.spec-implement]
description = "Implementa una tarea con contexto y evidencia de cierre."
prompt = """
Tarea solicitada: la solicitud del desarrollador

Usa el prompt MCP implement_task para la iniciativa y tarea indicadas. Carga solo el contexto relevante, cambia el estado a in_progress, ejecuta la validación y solo marca done mediante update_task() incluyendo completion_evidence con el comando y resultado observado. Si aparece un trade-off persistente, registra una decisión.
"""

[prompts.spec-review]
description = "Revisa una iniciativa contra sus criterios de aceptación."
prompt = """
Iniciativa: la solicitud del desarrollador

Usa el prompt MCP review_against_spec. Comprueba cada criterio de aceptación contra evidencia y tareas, informa criterios cumplidos y no cumplidos, y recomienda aprobar, pedir cambios o bloquear.
"""

[prompts.spec-close]
description = "Cierra una iniciativa con trazabilidad y validación."
prompt = """
Iniciativa: la solicitud del desarrollador

Usa el prompt MCP close_initiative. No cierres la spec hasta revisar criterios de aceptación, estado de tareas y evidencia. Actualiza trazabilidad, roadmap y sesión únicamente si corresponde.
"""

[prompts.spec-context]
description = "Carga contexto mínimo por tag o ID de artefacto."
prompt = """
Consulta: la solicitud del desarrollador

Usa el MCP de SpecNative. Si se proporcionó un ID DEC-, ARCH- o CONV-, usa read_context_artifact(). Si se proporcionó un tag, consulta list_decisions(), list_architecture() y list_conventions() con ese tag, y lee solo los artefactos necesarios. Resume restricciones aplicables.
"""

[prompts.spec-architecture]
description = "Registra un artefacto de arquitectura canónico."
prompt = """
Solicitud: la solicitud del desarrollador

Usa el MCP de SpecNative. Consulta list_architecture(), decisiones y specs relacionadas. Obtén contexto, diseño, consecuencias, tags y relaciones; presenta un borrador y, tras confirmación, usa log_architecture(). No edites ARCHITECTURE.md directamente.
"""

[prompts.spec-convention]
description = "Registra una convención persistente y relacionable."
prompt = """
Solicitud: la solicitud del desarrollador

Usa el MCP de SpecNative. Consulta list_conventions() y artefactos relacionados. Obtén justificación, regla, consecuencias, tags y relaciones; presenta un borrador y, tras confirmación, usa log_convention(). No edites CONVENTIONS.md directamente.
"""
