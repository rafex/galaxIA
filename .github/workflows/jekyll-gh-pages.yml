# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch, solo cuando cambia el sitio
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "docs/**"
      - "helpers/shell/render-d2.sh"
      - "helpers/shell/validate-markdown-links.sh"
      - ".github/workflows/jekyll-gh-pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install D2 v0.9.0
        env:
          D2_VERSION: v0.9.0
        run: |
          mkdir -p "$RUNNER_TEMP/d2"
          curl --fail --silent --show-error --location \
            -o "$RUNNER_TEMP/d2.tar.gz" \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP/d2" --strip-components=1
          test -x "$RUNNER_TEMP/d2/bin/d2"
          "$RUNNER_TEMP/d2/bin/d2" --version
      - name: Render D2 diagrams
        env:
          D2_BIN: ${{ runner.temp }}/d2/bin/d2
        run: bash helpers/shell/render-d2.sh
      - name: Validate Markdown links
        run: bash helpers/shell/validate-markdown-links.sh
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
