name: CI IDL

on:
  push:
    branches: [main]
    paths:
      - "idl/**"
      - "schemas/**"
      - "helpers/**"
      - "Justfile"
      - "Makefile"
  pull_request:
    paths:
      - "idl/**"
      - "schemas/**"
      - "helpers/**"
      - "Justfile"
      - "Makefile"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v5

      - name: Setup project
        run: just setup

      - name: Validate IDL
        run: just ci
