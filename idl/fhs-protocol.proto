syntax = "proto3";

// FHS Wire Protocol — Protobuf IDL
// Versión de referencia: @rafex/galaxia-fhs-protocol@0.1.23
// Repositorio de tipos: https://github.com/rafex/galaxIA-SDK
//
// NOTA: El transporte primario del protocolo FHS es WebSocket con JSON.
// Este archivo Protobuf documenta los contratos de forma independiente
// del lenguaje para facilitar la generación de clientes (Java, Python,
// Rust, Go). El campo `type` en los mensajes JSON equivale al `oneof`
// en Protobuf.

package fhs.v1;

option java_package = "io.galax_ia.fhs.v1";
option java_outer_classname = "FhsProtocol";
option go_package = "github.com/rafex/galaxIA/idl/fhs/v1";

// ── Tipos base ───────────────────────────────────────────────────────────────

message CallerAuth {
  string caller_id  = 1; // DID del nodo que origina la solicitud (did:key:...)
  string signature  = 2; // Firma Ed25519 en base64 de `callerId:missionId:timestamp`
  int64  timestamp  = 3; // Unix ms del momento de firma
}

message Message {
  string role         = 1; // user | assistant | system | tool
  string content      = 2;
  string tool_call_id = 3; // Solo cuando role == "tool"
  repeated ToolCall tool_calls = 4;
}

message ToolDefinition {
  string name         = 1;
  string description  = 2;
  string input_schema = 3; // JSON Schema serializado
}

message ToolCall {
  string id   = 1;
  string type = 2; // Siempre "function"
  ToolCallFunction function = 3;
}

message ToolCallFunction {
  string name      = 1;
  string arguments = 2; // JSON serializado de los argumentos
}

// ── Mensajes del protocolo FHS ───────────────────────────────────────────────

// chat.request — Cliente → Navigator
message ChatRequestMessage {
  string mission_id                     = 1;
  repeated Message messages             = 2;
  repeated ToolDefinition tools         = 3;
  string model                          = 4;
  int64  timestamp                      = 5;
  CallerAuth auth                       = 6;
}

// chat.cancel — Cliente → Navigator
message ChatCancelMessage {
  string mission_id = 1;
  int64  timestamp  = 2;
}

// chat.delta — Navigator → Cliente (streaming)
message ChatDeltaMessage {
  string mission_id = 1;
  string delta      = 2;
  int64  timestamp  = 3;
}

// chat.completed — Navigator → Cliente
message ChatCompletedMessage {
  string mission_id              = 1;
  string content                 = 2;
  repeated ToolCall tool_calls   = 3;
  int64  timestamp               = 4;
}

// chat.error — Navigator → Cliente
message ChatErrorMessage {
  string mission_id = 1;
  string error      = 2;
  int64  timestamp  = 3;
}

// dispatch.ack — Navigator → Atlas (confirmación de dispatch)
message DispatchAckMessage {
  string mission_id = 1;
  int64  queued_at  = 2;
}

// tool.call — Navigator → Provider (solicitud de tool)
message ToolCallRequestMessage {
  string mission_id              = 1;
  repeated ToolCall tool_calls   = 2;
  int64  timestamp               = 3;
}

// tool.cancel — Navigator → Provider
message ToolCancelMessage {
  string mission_id = 1;
  int64  timestamp  = 2;
}

// tool.result — Provider → Navigator
message ToolCallResultMessage {
  string mission_id   = 1;
  string tool_call_id = 2;
  string result       = 3; // JSON serializado del resultado
  int64  timestamp    = 4;
}

// tool.error — Provider → Navigator
message ToolCallErrorMessage {
  string mission_id   = 1;
  string tool_call_id = 2;
  string error        = 3;
  int64  timestamp    = 4;
}

// tool.list — Navigator → Provider (solicitud de lista de tools)
message ToolListRequestMessage {
  string mission_id = 1;
  int64  timestamp  = 2;
}

// tool.list.response — Provider → Navigator
message ToolListResponseMessage {
  string mission_id                   = 1;
  repeated ToolDefinition tools       = 2;
  int64  timestamp                    = 3;
}

// ── Mensajes de registro y ciclo de vida ────────────────────────────────────

// hello — Provider → Atlas
// Primer mensaje tras abrir el WebSocket. Firma: Ed25519 de "providerId:timestamp".
message HelloMessage {
  string provider_id  = 1; // DID Ed25519 del provider (did:key:z...)
  int64  timestamp    = 2; // Unix ms. Ventana anti-replay ±30 000 ms (MAX_CLOCK_SKEW_MS=5000)
  string fhs_version  = 3; // Versión del protocolo que anuncia el provider (ej. "0.1")
  string signature    = 4; // Base64 Ed25519 de "providerId:timestamp"
}

// welcome — Atlas → Provider
// Responde a hello. Firma: Ed25519 de "registryId:timestamp" con la clave del Registry.
message WelcomeMessage {
  string registry_id        = 1; // DID Ed25519 del Registry (did:key:z...)
  int32  lease_seconds      = 2; // Duración del lease en segundos (default 30)
  int32  heartbeat_seconds  = 3; // Intervalo de ping recomendado en segundos (default 10)
  string fhs_version        = 4; // Versión de protocolo acordada para esta sesión
  int64  timestamp          = 5; // Unix ms del momento de emisión
  string signature          = 6; // Base64 Ed25519 de "registryId:timestamp"
}

// register — Provider → Atlas
// Envía el Beacon firmado. Firma: Ed25519 de "providerId:timestamp:sha256hex(manifiesto canónico)".
message RegisterMessage {
  string provider_id = 1; // DID del provider — debe coincidir con hello
  string manifest    = 2; // Beacon serializado como JSON (ver schemas/beacon-*.schema.json)
  int64  timestamp   = 3; // Unix ms
  string signature   = 4; // Base64 Ed25519 de "providerId:timestamp:sha256hex(manifest)"
}

// registered — Atlas → Provider
// El provider está en Orbit; indica lease y capacidades aceptadas.
message RegisteredMessage {
  int64 lease_expires      = 1; // Unix ms cuando vence el lease actual
  int32 accepted_services  = 2; // Número de capabilities aceptadas del manifiesto
}

// ping — Provider → Atlas (Pulse / heartbeat)
// Mensaje vacío: el provider lo emite cada heartbeat_seconds para renovar el lease.
message PingMessage {}

// pong — Atlas → Provider
// Respuesta al ping con timestamp del servidor.
message PongMessage {
  int64 timestamp = 1; // Unix ms del momento en que Atlas procesa el ping
}

// ErrorMessage — Atlas → Provider
// Error estandarizado con código semántico.
enum FhsErrorCode {
  FHS_ERROR_CODE_UNSPECIFIED    = 0;
  NOT_IDENTIFIED                = 1;  // Mensaje recibido antes de completar hello
  INVALID_MANIFEST              = 2;  // Manifiesto no cumple el schema mínimo
  INVALID_SIGNATURE             = 3;  // Firma inválida en hello o register
  UNSUPPORTED_VERSION           = 4;  // fhsVersion no compatible con el Registry
  UPSTREAM_UNAVAILABLE          = 5;  // Servicio real detrás del provider no responde
  UPSTREAM_TIMEOUT              = 6;  // Servicio real respondió más lento que el timeout
  INVALID_ARGUMENTS             = 7;  // Argumentos de tool.call/chat.request inválidos
  UNSUPPORTED_CAPABILITY        = 8;  // Capability o modelo no registrado en el provider
  UNAUTHORIZED                  = 9;  // callerId/signature inválidos o vetados
  CANCELLED                     = 10; // Petición abortada tras chat.cancel/tool.cancel
  OVERLOADED                    = 11; // Nodo a capacidad máxima; rechaza sin dispatch.ack
  INTERNAL_ERROR                = 12; // Fallo no clasificado
}

message ErrorMessage {
  FhsErrorCode code = 1;
  string message    = 2; // Descripción legible del error (opcional)
}

// ── Notificaciones internas Atlas → Navigator ────────────────────────────────

message NodeService {
  string kind                    = 1; // "star" | "satellite" | "nova" | "multi"
  repeated string capabilities   = 2; // IDs de las capacidades del nodo
}

// node.online — Atlas → Navigator
// Un provider entró en Orbit tras registro exitoso.
message NodeOnlineMessage {
  string provider_id              = 1; // DID del provider
  string provider_name            = 2; // Nombre legible del manifiesto
  repeated NodeService services   = 3;
}

// node.lost — Atlas → Navigator
// Un provider perdió su lease o cerró la conexión.
message NodeLostMessage {
  string provider_id              = 1; // DID del provider
  string provider_name            = 2; // Nombre legible del manifiesto
  repeated NodeService services   = 3;
}

// ── Framing (modo binario P2P) ───────────────────────────────────────────────
// En modo WebSocket binario (Sec-WebSocket-Protocol: fhs.v1), cada frame es:
//   [varint: byte-length del FhsMessage serializado][FhsMessage bytes]
// El varint usa la codificación estándar de protobuf (little-endian base-128).
// Longitud máxima de frame: 16 MiB. Ver: idl/framing.md
//
// En modo JSON compat (Sec-WebSocket-Protocol: fhs.v1.json), el frame es texto
// y el campo `type` actúa como discriminador equivalente al oneof.

// ── Gossip P2P (Atlas ↔ Atlas) ───────────────────────────────────────────────

// atlas.announce — Atlas → Atlas
// Un Atlas anuncia a otro Atlas los providers que tiene en Orbit.
// Permite federación entre instancias Atlas sin coordinator central.
message AtlasAnnounceMessage {
  string           atlas_id      = 1; // DID del Atlas que anuncia (did:key:z...)
  repeated string  provider_ids  = 2; // DIDs de providers actualmente en Orbit
  int64            timestamp     = 3; // Unix ms
  string           signature     = 4; // Ed25519 de "atlasId:timestamp"
}

// atlas.sync — Atlas → Atlas (respuesta a atlas.announce)
// Devuelve el estado completo de los providers para sincronizar el routing table.
message AtlasSyncMessage {
  string                    atlas_id  = 1; // DID del Atlas que responde
  repeated NodeOnlineMessage providers = 2; // Estado completo de cada provider
  int64                     timestamp = 3;
}

// ── Envelope de mensajes ──────────────────────────────────────────────────────

// FhsMessage — frame del wire protocol FHS.
// En modo binario (fhs.v1): serializado como proto3 con LPP framing (ver arriba).
// En modo JSON (fhs.v1.json): el campo `type` equivale al oneof.
message FhsMessage {
  // Versión del protocolo usada en este frame (ej. "1").
  // Complementa la negociación fhsVersion de hello/welcome.
  // Receptores que no reconozcan la versión DEBEN ignorar el frame.
  string version = 22;

  oneof payload {
    // Mensajes de misión (chat + tool)
    ChatRequestMessage      chat_request    = 1;
    ChatCancelMessage       chat_cancel     = 2;
    ChatDeltaMessage        chat_delta      = 3;
    ChatCompletedMessage    chat_completed  = 4;
    ChatErrorMessage        chat_error      = 5;
    DispatchAckMessage      dispatch_ack    = 6;
    ToolCallRequestMessage  tool_call       = 7;
    ToolCancelMessage       tool_cancel     = 8;
    ToolCallResultMessage   tool_result     = 9;
    ToolCallErrorMessage    tool_error      = 10;
    ToolListRequestMessage  tool_list       = 11;
    ToolListResponseMessage tool_list_resp  = 12;
    // Registro y ciclo de vida (Provider ↔ Atlas)
    HelloMessage            hello           = 13;
    WelcomeMessage          welcome         = 14;
    RegisterMessage         register        = 15;
    RegisteredMessage       registered      = 16;
    PingMessage             ping            = 17;
    PongMessage             pong            = 18;
    ErrorMessage            error           = 19;
    // Notificaciones internas (Atlas → Navigator)
    NodeOnlineMessage       node_online     = 20;
    NodeLostMessage         node_lost       = 21;
    // Gossip P2P (Atlas ↔ Atlas) — DEC-0086
    AtlasAnnounceMessage    atlas_announce  = 23;
    AtlasSyncMessage        atlas_sync      = 24;
  }
}
