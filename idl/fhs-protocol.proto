syntax = "proto3";

// FHS Wire Protocol — Protobuf IDL v2
// DEC-0086: Protobuf binario primario, LPP framing (idl/framing.md)
// DEC-0087: Envelope P2P con routing fields, Handshake 2-step, sin CallerAuth
//
// Versión de referencia: @rafex/galaxia-fhs-protocol
// Repositorio de tipos: https://github.com/rafex/galaxIA-SDK
//
// Framing (modo binario, Sec-WebSocket-Protocol: fhs.v1):
//   [varint: byte-length del Envelope serializado][Envelope bytes]
// Modo JSON compat (Sec-WebSocket-Protocol: fhs.v1.json):
//   el campo `type` del JSON actúa como discriminador del oneof.
// Ver idl/framing.md para la spec completa.

package fhs.v1;

option java_package = "io.galax_ia.fhs.v1";
option java_outer_classname = "FhsProtocol";
option go_package = "github.com/rafex/galaxIA/idl/fhs/v1";

// ── Envelope P2P ─────────────────────────────────────────────────────────────
// Frame raíz del wire protocol FHS.
// En modo binario: serializado con LPP framing (idl/framing.md).
// En modo JSON: los campos del Envelope van al nivel raíz del objeto JSON.

message Envelope {
  // ── Campos de routing (nivel de frame) ─────────────────────────────────────
  string message_id     = 1;  // UUID único por frame (deduplicación en redes P2P)
  string source_peer_id = 2;  // DID del nodo emisor (did:key:z...)
  string dest_peer_id   = 3;  // DID del destino; vacío = broadcast / cualquier Atlas
  int64  timestamp      = 4;  // Unix ms — anti-replay (ventana recomendada ±30 000 ms)
  string version        = 5;  // Versión del protocolo FHS ("1")
  string signature      = 6;  // Ed25519 base64 de sha256(message_id:source:dest:timestamp:payload_bytes_hex)

  // ── Payload ─────────────────────────────────────────────────────────────────
  oneof payload {
    // Ciclo de vida P2P (Provider ↔ Atlas)     [10-19]
    HandshakeMessage        handshake       = 10;
    HandshakeAckMessage     handshake_ack   = 11;
    PingMessage             ping            = 12;
    PongMessage             pong            = 13;
    ErrorMessage            error           = 14;

    // Misiones — Chat (Navigator ↔ Star/Cliente) [20-29]
    ChatRequestMessage      chat_request    = 20;
    ChatCancelMessage       chat_cancel     = 21;
    ChatDeltaMessage        chat_delta      = 22;
    ChatCompletedMessage    chat_completed  = 23;
    ChatErrorMessage        chat_error      = 24;
    DispatchAckMessage      dispatch_ack    = 25;

    // Misiones — Tool (Navigator ↔ Satellite)  [30-39]
    ToolCallRequestMessage  tool_call       = 30;
    ToolCancelMessage       tool_cancel     = 31;
    ToolCallResultMessage   tool_result     = 32;
    ToolCallErrorMessage    tool_error      = 33;
    ToolListRequestMessage  tool_list       = 34;
    ToolListResponseMessage tool_list_resp  = 35;

    // Notificaciones internas (Atlas → Navigator) [40-49]
    NodeOnlineMessage       node_online     = 40;
    NodeLostMessage         node_lost       = 41;

    // Gossip P2P (Atlas ↔ Atlas)               [50-59]
    AtlasAnnounceMessage      atlas_announce      = 50;
    AtlasSyncMessage          atlas_sync          = 51;

    // Portal ↔ Navigator (interfaz de agente)  [60-69]
    AgentStartMessage         agent_start         = 60;
    AgentStatusMessage        agent_status        = 61;
    StarSelectedMessage       star_selected       = 62;
    ToolSelectedMessage       tool_selected       = 63;
    AssistantDeltaMessage     assistant_delta     = 64;
    AssistantCompletedMessage assistant_completed = 65;

    // Ephemeral Satellite (SPEC-EPHSAT-0001)   [70-79]
    // Navigator conecta al canal /register de Atlas y envía mission.feedback
    // tras completar una Mission con un Ephemeral Satellite.
    MissionFeedbackMessage    mission_feedback    = 70;
  }
}

// ── Ciclo de vida P2P ─────────────────────────────────────────────────────────
// Flujo: handshake → handshake_ack → ping/pong (cada heartbeatSeconds).
// La identidad del provider viene de Envelope.source_peer_id.
// La autenticación bilateral usa Envelope.signature (cada sentido firma su Envelope).

// handshake — Provider → Atlas
// Reemplaza el flujo anterior de 4 mensajes: hello → welcome → register → registered.
// Lleva el Beacon firmado y los endpoints P2P del nodo.
// Si es un Ephemeral Satellite (beacon.provider.ephemeral == true), incluye delegation_token.
message HandshakeMessage {
  string          fhs_version      = 1;  // Versión del protocolo FHS que soporta este nodo
  repeated string listen_addrs     = 2;  // Multiaddrs P2P (ej. /ip4/1.2.3.4/tcp/8081/ws)
  string          beacon           = 3;  // Beacon JSON serializado (manifiesto completo del nodo)
  DelegationToken delegation_token = 4;  // Solo presente en Ephemeral Satellites (SPEC-EPHSAT-0001)
}

// handshake_ack — Atlas → Provider
// El provider está en Orbit tras recibir este mensaje.
// Si el handshake fue rechazado, Atlas envía un ErrorMessage (DELEGATION_INVALID / DELEGATION_EXPIRED)
// y cierra la conexión sin enviar handshake_ack.
message HandshakeAckMessage {
  string fhs_version       = 1;  // Versión del protocolo acordada para esta sesión
  int32  lease_seconds     = 2;  // Duración del lease en segundos (default 30)
  int32  heartbeat_seconds = 3;  // Intervalo de ping recomendado en segundos (default 10)
  int64  lease_expires     = 4;  // Unix ms cuando vence el lease actual
  int32  accepted_services = 5;  // Número de capabilities aceptadas del Beacon
  string trust_level       = 6;  // "standard" | "delegated" | "community" | "unverified" (SPEC-EPHSAT-0001)
}

// ping — Provider → Atlas (Pulse / heartbeat)
// Mensaje vacío: el provider lo emite cada heartbeatSeconds para renovar el lease.
message PingMessage {}

// pong — Atlas → Provider
// Respuesta al ping. Conserva el server_timestamp para calcular el RTT.
message PongMessage {
  int64 server_timestamp = 1;  // Unix ms cuando Atlas procesa el ping
}

// error — Atlas ↔ Provider (o cualquier nodo → cualquier nodo)
enum FhsErrorCode {
  FHS_ERROR_CODE_UNSPECIFIED    = 0;
  NOT_IDENTIFIED                = 1;  // Mensaje recibido antes de handshake completo
  INVALID_MANIFEST              = 2;  // Beacon no cumple el schema mínimo
  INVALID_SIGNATURE             = 3;  // Firma inválida en Envelope o handshake
  UNSUPPORTED_VERSION           = 4;  // fhsVersion no compatible con el Registry
  UPSTREAM_UNAVAILABLE          = 5;  // Servicio detrás del provider no responde
  UPSTREAM_TIMEOUT              = 6;  // Servicio respondió más lento que el timeout
  INVALID_ARGUMENTS             = 7;  // Argumentos de tool.call/chat.request inválidos
  UNSUPPORTED_CAPABILITY        = 8;  // Capability o modelo no registrado en el provider
  UNAUTHORIZED                  = 9;  // source_peer_id/signature inválidos o vetados
  CANCELLED                     = 10; // Petición abortada tras chat.cancel/tool.cancel
  OVERLOADED                    = 11; // Nodo a capacidad máxima (availability.maxConcurrentRequests)
  INTERNAL_ERROR                = 12; // Fallo no clasificado
  // Ephemeral Satellite (SPEC-EPHSAT-0001)
  DELEGATION_INVALID            = 13; // DelegationToken: firma inválida, Host no en Orbit, o campos mal formados
  DELEGATION_EXPIRED            = 14; // DelegationToken.expires_at ya venció (o Host salió del Orbit)
  WASM_HASH_MISMATCH            = 15; // Hash SHA-256 del bundle WASM no coincide con DelegationToken.wasm_hash
}

message ErrorMessage {
  FhsErrorCode code    = 1;
  string       message = 2;  // Descripción legible (opcional, no machine-readable)
}

// ── Tipos base ───────────────────────────────────────────────────────────────

message Message {
  string            role         = 1;  // user | assistant | system | tool
  string            content      = 2;
  string            tool_call_id = 3;  // Solo cuando role == "tool"
  repeated ToolCall tool_calls   = 4;
}

message ToolDefinition {
  string name         = 1;
  string description  = 2;
  string input_schema = 3;  // JSON Schema serializado
}

message ToolCall {
  string           id       = 1;
  string           type     = 2;  // Siempre "function"
  ToolCallFunction function = 3;
}

message ToolCallFunction {
  string name      = 1;
  string arguments = 2;  // JSON serializado de los argumentos
}

// ── Mensajes de misión — Chat ─────────────────────────────────────────────────
// El callerId viene de Envelope.source_peer_id.
// La autenticación viene de Envelope.signature.
// El timestamp viene de Envelope.timestamp.

// chat.request — Cliente/Navigator → Star
message ChatRequestMessage {
  string              mission_id = 1;
  repeated Message    messages   = 2;
  repeated ToolDefinition tools  = 3;
  string              model      = 4;  // Modelo LLM solicitado (opcional)
}

// chat.cancel — Cliente → Navigator
message ChatCancelMessage {
  string mission_id = 1;
}

// chat.delta — Navigator → Cliente (streaming)
message ChatDeltaMessage {
  string mission_id = 1;
  string delta      = 2;
}

// chat.completed — Navigator → Cliente
message ChatCompletedMessage {
  string            mission_id = 1;
  string            content    = 2;
  repeated ToolCall tool_calls = 3;
}

// chat.error — Navigator → Cliente
message ChatErrorMessage {
  string mission_id = 1;
  string error      = 2;
}

// dispatch.ack — Navigator → Atlas
// Confirma que Navigator encoló la misión. queued_at es el timestamp de negocio
// (cuándo entró en la cola, puede diferir del Envelope.timestamp).
message DispatchAckMessage {
  string mission_id = 1;
  int64  queued_at  = 2;
}

// ── Mensajes de misión — Tool ─────────────────────────────────────────────────

// tool.call — Navigator → Satellite
message ToolCallRequestMessage {
  string            mission_id = 1;
  repeated ToolCall tool_calls = 2;
}

// tool.cancel — Navigator → Satellite
message ToolCancelMessage {
  string mission_id = 1;
}

// tool.result — Satellite → Navigator
message ToolCallResultMessage {
  string mission_id   = 1;
  string tool_call_id = 2;
  string result       = 3;  // JSON serializado del resultado
}

// tool.error — Satellite → Navigator
message ToolCallErrorMessage {
  string mission_id   = 1;
  string tool_call_id = 2;
  string error        = 3;
}

// tool.list — Navigator → Satellite
message ToolListRequestMessage {
  string mission_id = 1;
}

// tool.list.response — Satellite → Navigator
message ToolListResponseMessage {
  string               mission_id = 1;
  repeated ToolDefinition tools   = 2;
}

// ── Ephemeral Satellite (SPEC-EPHSAT-0001) ────────────────────────────────────
// DelegationToken — Credencial firmada por el Nodo Host para delegar capacidades
// a un Ephemeral Satellite. Viaja en HandshakeMessage.delegation_token.
//
// La firma cubre los campos 1-5 (issuer, subject, capabilities, wasm_hash, expires_at)
// en su serialización proto canónica (determinista). Atlas verifica la firma usando
// la clave pública Ed25519 derivada directamente del DID issuer (did:key:z... codifica
// la clave pública — no se requiere PKI externa).
message DelegationToken {
  string          issuer       = 1;  // DID del Nodo Host firmante (did:key:z...)
  string          subject      = 2;  // DID del Ephemeral Satellite (did:key:z...) — debe coincidir con Envelope.sourcePeerId
  repeated string capabilities = 3;  // Capability IDs que el Host delega (subconjunto de los suyos)
  string          wasm_hash    = 4;  // "sha256:<64-hex>" del bundle WASM que el Ephemeral Satellite ejecutará
  int64           expires_at   = 5;  // Unix ms de expiración del token
  bytes           signature    = 6;  // Firma Ed25519 sobre el canonical proto de campos 1-5
}

// mission.feedback — Navigator → Atlas (canal /register, SPEC-EPHSAT-0001)
// Navigator reporta la calidad de una Mission completada por un Ephemeral Satellite.
// Extiende SPEC-SATRATING-0001: Atlas actualiza la reputación del Ephemeral Satellite
// y el contador de delegaciones exitosas del Nodo Host.
//
// Navigator mantiene una conexión WS al canal /register de Atlas (mismo canal que
// los providers usan para handshake/ping). Navigator también hace handshake al
// iniciar — es un nodo más en la red FHS.
message MissionFeedbackMessage {
  string mission_id    = 1;  // UUID de la Mission completada
  string satellite_did = 2;  // DID del Ephemeral Satellite evaluado
  float  latency_ms    = 3;  // Latencia real de la Mission (ms)
  bool   success       = 4;  // true = completó sin error
  string error_code    = 5;  // FhsErrorCode como string; vacío si success = true
  string delegated_by  = 6;  // DID del Nodo Host (para actualizar reputación derivada); vacío si TrustLevel.UNVERIFIED
}

// ── Notificaciones internas (Atlas → Navigator) ───────────────────────────────

message NodeService {
  string          kind         = 1;  // "star" | "satellite" | "nova" | "multi"
  repeated string capabilities = 2;  // IDs de las capabilities del nodo
}

// node.online — Atlas → Navigator
// Un provider entró en Orbit tras handshake exitoso.
// Para Ephemeral Satellites, trust_level y delegated_by permiten que Navigator
// muestre el nivel de confianza en la ProvenanceInfo sin consultar Atlas.
message NodeOnlineMessage {
  string             provider_id   = 1;
  string             provider_name = 2;
  repeated NodeService services    = 3;
  bool               ephemeral     = 4;  // true si es un Ephemeral Satellite (SPEC-EPHSAT-0001)
  string             trust_level   = 5;  // "standard" | "delegated" | "community" | "unverified"
  string             delegated_by  = 6;  // DID del Nodo Host; vacío si no es Ephemeral Satellite
}

// node.lost — Atlas → Navigator
// Un provider perdió su lease o cerró la conexión.
// Para Ephemeral Satellites, también se emite cuando su Nodo Host sale del Orbit.
message NodeLostMessage {
  string             provider_id   = 1;
  string             provider_name = 2;
  repeated NodeService services    = 3;
}

// ── Gossip P2P (Atlas ↔ Atlas) ───────────────────────────────────────────────
// El atlasId viene de Envelope.source_peer_id.
// El timestamp y la firma vienen del Envelope.

// atlas.announce — Atlas → Atlas
// Anuncia los providers en Orbit para sincronizar routing tables.
message AtlasAnnounceMessage {
  repeated string provider_ids = 1;  // DIDs de providers actualmente en Orbit
}

// atlas.sync — Atlas → Atlas (respuesta a atlas.announce)
// Devuelve el estado completo de los providers para sincronizar el routing table.
message AtlasSyncMessage {
  repeated NodeOnlineMessage providers = 1;
}

// ── Portal ↔ Navigator (interfaz de agente, IDL-007) ─────────────────────────
// Mensajes que viajan entre el Portal (chat UI) y el Navigator (Agent Runtime).
// Todos usan el Envelope estándar: sourcePeerId = DID del Portal o del Navigator.

// agent.start — Portal → Navigator
// Inicia una sesión de agente. El sessionId correlaciona múltiples misiones del
// mismo usuario. Enviado antes del primer chat.request de la sesión.
message AgentStartMessage {
  string session_id = 1;  // UUID de la sesión Portal
  string scope      = 2;  // "local" | "network" | "community" | "external"
  string model      = 3;  // Modelo LLM preferido (hint; Navigator puede ignorarlo)
}

// agent.status — Navigator → Portal
// Notifica el estado actual del agente durante el procesamiento de una misión.
message AgentStatusMessage {
  string mission_id = 1;
  string status     = 2;  // "thinking" | "calling_star" | "calling_satellite" | "streaming" | "completed" | "error"
}

// star.selected — Navigator → Portal
// Informa qué Star (LLM provider) fue seleccionado para procesar la misión.
message StarSelectedMessage {
  string mission_id  = 1;
  string provider_id = 2;  // DID del Star seleccionado (did:key:z...)
  string model       = 3;  // Modelo LLM que usará el Star
}

// tool.selected — Navigator → Portal
// Informa qué Satellite y capability están siendo invocados.
message ToolSelectedMessage {
  string mission_id    = 1;
  string provider_id   = 2;  // DID del Satellite invocado (did:key:z...)
  string capability_id = 3;  // ID de la capability del Satellite
}

// assistant.delta — Navigator → Portal (streaming)
// Fragmento de texto de la respuesta final del agente hacia el Portal.
// Equivalente a chat.delta pero a nivel Portal↔Navigator (incluye postprocesado del Navigator).
message AssistantDeltaMessage {
  string mission_id = 1;
  string delta      = 2;
}

// ProvenanceInfo — trazabilidad de la misión
// Qué Star generó la respuesta, qué Satellites se invocaron, jurisdicción, etc.
message ProvenanceInfo {
  string           provider_id        = 1;  // DID del Star que generó la respuesta
  string           model              = 2;  // Modelo LLM utilizado
  int32            completion_tokens  = 3;  // Tokens generados en la respuesta
  repeated string  tool_provider_ids  = 4;  // DIDs de Satellites invocados
  bool             data_exported      = 5;  // true si algún tool exportó datos fuera del nodo
  string           jurisdiction       = 6;  // Jurisdicción legal del Star (ej. "MX")
}

// assistant.completed — Navigator → Portal
// Respuesta final del agente incluyendo la provenance completa de la misión.
message AssistantCompletedMessage {
  string         mission_id = 1;
  string         content    = 2;  // Respuesta completa del agente
  ProvenanceInfo provenance = 3;
}
