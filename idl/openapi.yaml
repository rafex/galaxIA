openapi: "3.1.0"

info:
  title: FHS REST API
  version: "0.2.0"
  description: |
    Federation of Sovereign Horizons (FHS) — endpoints REST de Atlas (Registry)
    y Navigator (Agent Runtime).

    ## Vocabulario canónico

    | Término    | Rol                                     |
    |------------|-----------------------------------------|
    | Star       | Proveedor de LLM                        |
    | Satellite  | Proveedor de tools/herramientas         |
    | Nova       | Agente con bucle autónomo               |
    | Atlas      | Registry / bootstrap peer               |
    | Navigator  | Agent Runtime (ejecuta misiones)        |
    | Beacon     | Manifiesto del nodo (ver schemas/)      |
    | Orbit      | Estado de provider registrado y activo  |

    ## Identidad

    Todos los nodos tienen un DID Ed25519 en formato `did:key:z...` (DEC-0030).
    Los endpoints REST usan este DID como `providerId` o `atlasId`, nunca un nombre
    legible ni un UUID arbitrario.

    ## Esquemas de Beacon

    Los manifiestos de cada tipo de nodo se validan contra los JSON Schema en `schemas/`:
    `beacon-base.schema.json`, `beacon-star.schema.json`, `beacon-satellite.schema.json`,
    `beacon-nova.schema.json`.

    Repositorio: https://github.com/rafex/galaxIA

  license:
    name: MIT
  contact:
    name: galaxIA
    url: https://github.com/rafex/galaxIA

servers:
  - url: "http://{atlas_host}:{atlas_port}"
    description: Atlas — Registry / bootstrap peer
    variables:
      atlas_host:
        default: localhost
      atlas_port:
        default: "8081"
  - url: "http://{navigator_host}:{navigator_port}"
    description: Navigator — Agent Runtime
    variables:
      navigator_host:
        default: localhost
      navigator_port:
        default: "8090"

tags:
  - name: Atlas
    description: Endpoints del nodo Atlas (Registry federado)
  - name: Discovery
    description: Consulta de providers y modelos disponibles en la red
  - name: Navigator
    description: Endpoints del nodo Navigator (Agent Runtime)
  - name: Metrics
    description: Métricas operativas y muestras de latencia

paths:
  # ── Salud ─────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Atlas, Navigator]
      summary: Estado del nodo
      operationId: getHealth
      responses:
        "200":
          description: Nodo operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Registro WebSocket ────────────────────────────────────────────────────
  /register:
    get:
      tags: [Atlas]
      summary: Registrar nodo provider via WebSocket (DEC-0087)
      description: |
        Upgrade a WebSocket con `Sec-WebSocket-Protocol: fhs.v1` (binario) o
        `fhs.v1.json` (compat JSON). El flujo 2-step: Provider envía `handshake`
        (con Beacon firmado) → Atlas responde con `handshake_ack` → `ping/pong`
        periódico renueva el lease. Ver `idl/asyncapi.yaml` canal `/register`.
      operationId: registerProvider
      responses:
        "101":
          description: Switching Protocols — conexión WebSocket establecida
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Nodos en Orbit ────────────────────────────────────────────────────────
  /nodes:
    get:
      tags: [Atlas]
      summary: Lista de todos los nodos en Orbit
      operationId: listNodes
      parameters:
        - $ref: "#/components/parameters/TypeFilter"
        - $ref: "#/components/parameters/ScopeFilter"
      responses:
        "200":
          description: Lista de nodos activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /nodes/{providerId}:
    get:
      tags: [Atlas]
      summary: Detalle de un nodo en Orbit
      operationId: getNode
      parameters:
        - name: providerId
          in: path
          required: true
          description: DID del provider (did:key:z...)
          schema:
            type: string
            pattern: "^did:key:z"
      responses:
        "200":
          description: Información completa del nodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Discovery ─────────────────────────────────────────────────────────────
  /api/fhs/providers:
    get:
      tags: [Discovery]
      summary: Lista de providers filtrada por tipo y scope
      description: |
        Devuelve los providers en Orbit visibles según el `scope` solicitado.
        El scope determina qué providers son accesibles:
        - `local`: solo providers del mismo host/proceso
        - `network`: providers en la red local (LAN)
        - `community`: providers visibles a grupos autorizados
        - `external`: cualquier provider público de la federación
      operationId: listProviders
      parameters:
        - $ref: "#/components/parameters/TypeFilter"
        - $ref: "#/components/parameters/ScopeFilter"
      responses:
        "200":
          description: Lista de providers que cumplen los filtros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/fhs/models:
    get:
      tags: [Discovery]
      summary: Modelos LLM disponibles en todos los Stars en Orbit
      description: |
        Agrega los campos `models[]` del Beacon de cada Star en Orbit y los devuelve
        en una lista plana. Útil para que el Portal muestre un selector de modelo.
      operationId: listModels
      parameters:
        - $ref: "#/components/parameters/ScopeFilter"
      responses:
        "200":
          description: Lista de modelos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Atlas Peers (P2P gossip, IDL-011) ─────────────────────────────────────
  /api/fhs/atlas/peers:
    get:
      tags: [Atlas]
      summary: Lista de Atlas peers conocidos
      description: |
        Devuelve los Atlas peers con los que este Atlas sincroniza su routing table
        via gossip (DEC-0086, canal `/atlas/gossip` de asyncapi.yaml).
        Útil para bootstrap de nuevos Atlas que se unen a la federación.
      operationId: listAtlasPeers
      responses:
        "200":
          description: Lista de Atlas peers conocidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtlasPeer"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Atlas]
      summary: Registrar un Atlas peer manualmente
      description: |
        Permite al operador añadir un Atlas peer conocido para establecer
        la sincronización de gossip. Atlas intentará conectarse inmediatamente.
      operationId: addAtlasPeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtlasPeerInput"
      responses:
        "201":
          description: Peer registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtlasPeer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: El peer ya está registrado

  # ── Métricas ──────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [Metrics]
      summary: Métricas operativas del nodo
      operationId: getMetrics
      responses:
        "200":
          description: Métricas operativas actuales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/fhs/metrics/sample:
    post:
      tags: [Metrics]
      summary: Enviar muestra de métricas (fire-and-forget)
      description: |
        Permite a providers y Navigator enviar muestras de latencia, éxito/error
        y uso de tokens. El Atlas las agrega para el endpoint `/metrics`.
        La respuesta es siempre 202 Accepted (no espera procesamiento síncrono).
      operationId: submitMetricSample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricSample"
      responses:
        "202":
          description: Muestra recibida (fire-and-forget)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Navigator ─────────────────────────────────────────────────────────────
  /chat:
    get:
      tags: [Navigator]
      summary: Sesión de chat via WebSocket (Portal↔Navigator)
      description: |
        Upgrade a WebSocket. El Portal envía `agent.start` para iniciar la sesión,
        luego `chat.request` para cada misión. Navigator devuelve `agent.status`,
        `star.selected`, `tool.selected`, `assistant.delta`, `assistant.completed`.
        Ver `idl/asyncapi.yaml` canales `/chat` y `/chat/stream`.
      operationId: chat
      responses:
        "101":
          description: Switching Protocols — sesión WebSocket establecida
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chat/stream:
    get:
      tags: [Navigator]
      summary: Stream de chat via Server-Sent Events
      description: |
        Alternativa SSE (text/event-stream) al WebSocket de /chat.
        Recibe el missionId en query param y escucha los eventos de la misión.
      operationId: chatStream
      parameters:
        - name: missionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stream SSE activo
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    TypeFilter:
      name: type
      in: query
      required: false
      description: Filtrar por tipo de provider
      schema:
        type: string
        enum: [star, satellite, nova, multi]

    ScopeFilter:
      name: scope
      in: query
      required: false
      description: Scope de descubrimiento (visibilidad mínima requerida)
      schema:
        $ref: "#/components/schemas/Scope"

  responses:
    BadRequest:
      description: Petición inválida — parámetros o cuerpo malformados
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: No autorizado — DID o firma inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: Nodo no disponible o en modo degradado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Tipos base ────────────────────────────────────────────────────────────
    Scope:
      type: string
      enum: [local, network, community, external]
      description: |
        Alcance de visibilidad y descubrimiento de providers.
        local: mismo host/proceso.
        network: red local (LAN).
        community: grupos autorizados.
        external: federación pública completa.

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Mensaje legible del error
        code:
          type: string
          description: Código semántico (ej. NOT_FOUND, UNAUTHORIZED)

    # ── Salud ─────────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, nodeId, uptime]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        nodeId:
          type: string
          description: DID del nodo (did:key:z...)
        uptime:
          type: integer
          description: Segundos en línea desde el último arranque
        version:
          type: string
          description: Versión del software del nodo

    # ── Nodos ─────────────────────────────────────────────────────────────────
    NodeSummary:
      type: object
      required: [providerId, type, visibility, registeredAt]
      properties:
        providerId:
          type: string
          pattern: "^did:key:z"
          description: DID Ed25519 del provider (did:key:z...)
        type:
          type: string
          enum: [star, satellite, nova, multi]
        visibility:
          type: string
          enum: [public, private, community]
        scope:
          $ref: "#/components/schemas/Scope"
        registeredAt:
          type: integer
          format: int64
          description: Unix ms del último handshake exitoso
        endpoint:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: FHS WebSocket URL del nodo
            multiaddr:
              type: string
              description: Multiaddr P2P del nodo (ej. /ip4/1.2.3.4/tcp/8081/ws)
        region:
          type: string
          description: Región geográfica declarada en el Beacon

    NodeDetail:
      allOf:
        - $ref: "#/components/schemas/NodeSummary"
        - type: object
          properties:
            beacon:
              $ref: "#/components/schemas/NodeBeacon"
            lastSeen:
              type: integer
              format: int64
              description: Unix ms del último ping recibido

    NodeBeacon:
      type: object
      description: |
        Beacon completo del nodo tal como fue recibido en el handshake.
        La estructura exacta varía según `provider.type` — ver schemas/beacon-*.schema.json.
      required: [fhsVersion, provider, endpoint, privacy]
      properties:
        fhsVersion:
          type: string
        provider:
          type: object
          required: [id, type, visibility]
          properties:
            id:
              type: string
              pattern: "^did:key:z"
              description: DID del provider — coincide con Envelope.sourcePeerId
            type:
              type: string
              enum: [star, satellite, nova, multi]
            visibility:
              type: string
              enum: [public, private, community]
            name:
              type: string
            region:
              type: string
        endpoint:
          type: object
          properties:
            url:
              type: string
              format: uri
            multiaddr:
              type: string
        availability:
          type: object
          properties:
            maxConcurrentRequests:
              type: integer
        privacy:
          type: object
          required: [retention]
          properties:
            retention:
              type: string
              enum: [none, session, persistent]
            jurisdiction:
              type: string

    # ── Discovery ─────────────────────────────────────────────────────────────
    ModelSummary:
      type: object
      required: [id, displayName, starProviderId]
      properties:
        id:
          type: string
          description: Identificador del modelo (ej. "llama3.2:3b")
        displayName:
          type: string
          description: Nombre legible del modelo
        starProviderId:
          type: string
          pattern: "^did:key:z"
          description: DID del Star que ofrece este modelo
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, completion, embedding, vision, tool_calling]
        contextWindow:
          type: integer
        toolCalling:
          type: boolean

    # ── Atlas Peers (IDL-011) ─────────────────────────────────────────────────
    AtlasPeer:
      type: object
      required: [atlasId, endpoint]
      properties:
        atlasId:
          type: string
          pattern: "^did:key:z"
          description: DID del Atlas peer (did:key:z...)
        endpoint:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: FHS WebSocket URL del Atlas peer (para /gossip)
            multiaddr:
              type: string
              description: Multiaddr P2P del Atlas peer
        lastSync:
          type: integer
          format: int64
          description: Unix ms de la última sincronización atlas.announce/atlas.sync exitosa
        providerCount:
          type: integer
          description: Número de providers conocidos por este Atlas peer en la última sync

    AtlasPeerInput:
      type: object
      required: [atlasId, endpoint]
      properties:
        atlasId:
          type: string
          pattern: "^did:key:z"
          description: DID del Atlas peer
        endpoint:
          type: object
          required: []
          anyOf:
            - required: [url]
            - required: [multiaddr]
          properties:
            url:
              type: string
              format: uri
            multiaddr:
              type: string

    # ── Provenance ────────────────────────────────────────────────────────────
    ProvenanceInfo:
      type: object
      description: |
        Trazabilidad de una misión: qué Star generó la respuesta, qué Satellites
        se invocaron, si se exportaron datos, y la jurisdicción del Star.
        Incluido en `assistant.completed` (AsyncAPI) y como campo de auditoría.
      required: [providerId, model]
      properties:
        providerId:
          type: string
          pattern: "^did:key:z"
          description: DID del Star que generó la respuesta
        model:
          type: string
          description: Modelo LLM utilizado (ej. "llama3.2:3b")
        completionTokens:
          type: integer
          description: Tokens generados en la respuesta
        toolProviderIds:
          type: array
          items:
            type: string
          description: DIDs de los Satellites invocados durante la misión
        dataExported:
          type: boolean
          description: true si algún tool exportó datos fuera del nodo local
        jurisdiction:
          type: string
          description: Jurisdicción legal del Star (ej. "MX", "EU", "US")

    # ── Métricas ──────────────────────────────────────────────────────────────
    MetricsResponse:
      type: object
      properties:
        totalNodes:
          type: integer
          description: Nodos en Orbit actualmente
        activeNodes:
          type: integer
          description: Nodos con lease vigente
        totalMissions:
          type: integer
          description: Misiones procesadas desde el arranque
        uptime:
          type: integer
          description: Segundos en línea
        stars:
          type: integer
          description: Stars en Orbit
        satellites:
          type: integer
          description: Satellites en Orbit
        novas:
          type: integer
          description: Novas en Orbit

    MetricSample:
      type: object
      required: [sourceId, missionId, latencyMs, success]
      properties:
        sourceId:
          type: string
          pattern: "^did:key:z"
          description: DID del nodo que envía la muestra (Provider o Navigator)
        missionId:
          type: string
          format: uuid
          description: UUID de la misión a la que pertenece la muestra
        latencyMs:
          type: integer
          description: Latencia en milisegundos de la operación
        success:
          type: boolean
          description: true si la misión completó sin error
        errorCode:
          type: string
          description: Código de error FHS si success = false (ej. UPSTREAM_TIMEOUT)
        completionTokens:
          type: integer
          description: Tokens generados (solo relevante para Stars)
        timestamp:
          type: integer
          format: int64
          description: Unix ms del momento de la medición
