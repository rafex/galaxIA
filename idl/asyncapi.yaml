asyncapi: "3.0.0"

info:
  title: FHS Wire Protocol
  version: "0.1.23"
  description: |
    Federation of Sovereign Horizons (FHS) — protocolo de mensajería entre
    nodos federados: Atlas (Registry), Navigator (Agent Runtime) y
    Satellites/Stars (Providers de LLM, tools, OCR, RAG, KB).

    Los mensajes viajan por WebSocket (ws://navigator/chat) y por HTTP SSE
    (GET /chat stream desde Navigator hacia Atlas).

    Versión de referencia: @rafex/galaxia-fhs-protocol@0.1.23
    Repositorio de tipos: https://github.com/rafex/galaxIA-SDK

  license:
    name: MIT
  contact:
    name: galaxIA
    url: https://github.com/rafex/galaxIA

defaultContentType: application/json

channels:
  # ── WebSocket: Cliente → Navigator ───────────────────────────────────────
  /chat:
    address: ws://{navigator}/chat
    messages:
      chatRequest:
        $ref: "#/components/messages/ChatRequestMessage"
      chatCancel:
        $ref: "#/components/messages/ChatCancelMessage"
      toolCallResult:
        $ref: "#/components/messages/ToolCallResultMessage"
      toolCallError:
        $ref: "#/components/messages/ToolCallErrorMessage"
      toolListResponse:
        $ref: "#/components/messages/ToolListResponseMessage"

    bindings:
      ws:
        method: GET

  # ── WebSocket: Navigator → Cliente ───────────────────────────────────────
  /chat/stream:
    address: ws://{navigator}/chat
    messages:
      chatDelta:
        $ref: "#/components/messages/ChatDeltaMessage"
      chatCompleted:
        $ref: "#/components/messages/ChatCompletedMessage"
      chatError:
        $ref: "#/components/messages/ChatErrorMessage"
      toolCallRequest:
        $ref: "#/components/messages/ToolCallRequestMessage"
      toolListRequest:
        $ref: "#/components/messages/ToolListRequestMessage"

  # ── WebSocket: Provider ↔ Atlas (registro y ciclo de vida) ───────────────
  /register:
    address: ws://{atlas}/register
    description: |
      Canal de ciclo de vida de un provider con Atlas.
      Flujo: hello → welcome → register → registered → ping/pong (cada 10 s).
      Una vez en estado Ready el mismo canal recibe dispatch.ack y tool.cancel.
    messages:
      hello:
        $ref: "#/components/messages/HelloMessage"
      welcome:
        $ref: "#/components/messages/WelcomeMessage"
      register:
        $ref: "#/components/messages/RegisterMessage"
      registered:
        $ref: "#/components/messages/RegisteredMessage"
      ping:
        $ref: "#/components/messages/PingMessage"
      pong:
        $ref: "#/components/messages/PongMessage"
      error:
        $ref: "#/components/messages/ErrorMessage"
      dispatchAck:
        $ref: "#/components/messages/DispatchAckMessage"
      toolCancel:
        $ref: "#/components/messages/ToolCancelMessage"
    bindings:
      ws:
        method: GET

  # ── WebSocket: Atlas → Navigator (notificaciones de topología) ───────────
  /atlas/nodes:
    address: ws://{atlas}/nodes
    description: |
      Notificaciones internas que Atlas emite hacia Navigator cuando
      un provider entra en Orbit (node.online) o pierde su lease (node.lost).
    messages:
      nodeOnline:
        $ref: "#/components/messages/NodeOnlineMessage"
      nodeLost:
        $ref: "#/components/messages/NodeLostMessage"
    bindings:
      ws:
        method: GET

components:
  messages:
    # ── Registro y ciclo de vida (Provider ↔ Atlas) ───────────────────────
    HelloMessage:
      name: hello
      title: Identificación inicial del provider
      summary: Provider → Atlas. Primer mensaje tras abrir el WebSocket. Lleva la identidad DID y la firma Ed25519.
      payload:
        $ref: "#/components/schemas/HelloMessage"

    WelcomeMessage:
      name: welcome
      title: Confirmación de identidad por el Registry
      summary: Atlas → Provider. Responde a hello con los parámetros de lease y la firma del Registry.
      payload:
        $ref: "#/components/schemas/WelcomeMessage"

    RegisterMessage:
      name: register
      title: Publicación del manifiesto (Beacon)
      summary: Provider → Atlas. Envía el Beacon firmado con hash canónico del manifiesto.
      payload:
        $ref: "#/components/schemas/RegisterMessage"

    RegisteredMessage:
      name: registered
      title: Confirmación de registro
      summary: Atlas → Provider. El provider está en Orbit; indica cuándo vence el lease.
      payload:
        $ref: "#/components/schemas/RegisteredMessage"

    PingMessage:
      name: ping
      title: Heartbeat (Pulse) del provider
      summary: Provider → Atlas. Enviado cada heartbeatSeconds para renovar el lease.
      payload:
        $ref: "#/components/schemas/PingMessage"

    PongMessage:
      name: pong
      title: Respuesta al Pulse
      summary: Atlas → Provider. Responde a ping con el timestamp del servidor.
      payload:
        $ref: "#/components/schemas/PongMessage"

    ErrorMessage:
      name: error
      title: Error estandarizado del Registry
      summary: Atlas → Provider. Código de error semántico (NOT_IDENTIFIED, INVALID_MANIFEST, etc.).
      payload:
        $ref: "#/components/schemas/ErrorMessage"

    NodeOnlineMessage:
      name: node.online
      title: Notificación de provider conectado
      summary: Atlas → Navigator. Un provider entró en Orbit tras registro exitoso.
      payload:
        $ref: "#/components/schemas/NodeOnlineMessage"

    NodeLostMessage:
      name: node.lost
      title: Notificación de provider perdido
      summary: Atlas → Navigator. Un provider perdió su lease o cerró la conexión.
      payload:
        $ref: "#/components/schemas/NodeLostMessage"

    # ── Mensajes de Chat ──────────────────────────────────────────────────
    ChatRequestMessage:
      name: chat.request
      title: Solicitud de chat
      payload:
        $ref: "#/components/schemas/ChatRequestMessage"

    ChatCancelMessage:
      name: chat.cancel
      title: Cancelación de chat en curso
      payload:
        $ref: "#/components/schemas/ChatCancelMessage"

    ChatDeltaMessage:
      name: chat.delta
      title: Fragmento de respuesta en streaming
      payload:
        $ref: "#/components/schemas/ChatDeltaMessage"

    ChatCompletedMessage:
      name: chat.completed
      title: Respuesta de chat completa
      payload:
        $ref: "#/components/schemas/ChatCompletedMessage"

    ChatErrorMessage:
      name: chat.error
      title: Error en el procesamiento del chat
      payload:
        $ref: "#/components/schemas/ChatErrorMessage"

    DispatchAckMessage:
      name: dispatch.ack
      title: Confirmación de dispatch a un provider
      payload:
        $ref: "#/components/schemas/DispatchAckMessage"

    ToolCallRequestMessage:
      name: tool.call
      title: Solicitud de ejecución de tool
      payload:
        $ref: "#/components/schemas/ToolCallRequestMessage"

    ToolCancelMessage:
      name: tool.cancel
      title: Cancelación de tool en ejecución
      payload:
        $ref: "#/components/schemas/ToolCancelMessage"

    ToolCallResultMessage:
      name: tool.result
      title: Resultado de ejecución de tool
      payload:
        $ref: "#/components/schemas/ToolCallResultMessage"

    ToolCallErrorMessage:
      name: tool.error
      title: Error en la ejecución de tool
      payload:
        $ref: "#/components/schemas/ToolCallErrorMessage"

    ToolListRequestMessage:
      name: tool.list
      title: Solicitud de lista de tools disponibles
      payload:
        $ref: "#/components/schemas/ToolListRequestMessage"

    ToolListResponseMessage:
      name: tool.list.response
      title: Lista de tools disponibles
      payload:
        $ref: "#/components/schemas/ToolListResponseMessage"

  schemas:
    # ── Mensajes de registro y ciclo de vida ──────────────────────────────
    HelloMessage:
      type: object
      required: [type, providerId, timestamp, fhsVersion, signature]
      properties:
        type:
          type: string
          enum: [hello]
        providerId:
          type: string
          description: DID Ed25519 del provider (did:key:z...)
        timestamp:
          type: integer
          format: int64
          description: Unix ms (Date.now()). Ventana anti-replay ±30 000 ms
        fhsVersion:
          type: string
          description: Versión del protocolo FHS que anuncia el provider (ej. "0.1")
        signature:
          type: string
          description: Firma Ed25519 en base64 de "providerId:timestamp" con la clave privada del nodo

    WelcomeMessage:
      type: object
      required: [type, registryId, leaseSeconds, heartbeatSeconds, fhsVersion, timestamp, signature]
      properties:
        type:
          type: string
          enum: [welcome]
        registryId:
          type: string
          description: DID Ed25519 del Registry (did:key:z...)
        leaseSeconds:
          type: integer
          description: Duración del lease en segundos (default 30). El provider se marca lost si no llega ping en este tiempo.
        heartbeatSeconds:
          type: integer
          description: Intervalo de ping recomendado en segundos (default 10)
        fhsVersion:
          type: string
          description: Versión de protocolo que usará esta sesión (negociada por el Registry)
        timestamp:
          type: integer
          format: int64
          description: Unix ms del momento de emisión
        signature:
          type: string
          description: Firma Ed25519 en base64 de "registryId:timestamp" con la clave privada del Registry

    RegisterMessage:
      type: object
      required: [type, providerId, manifest, timestamp, signature]
      properties:
        type:
          type: string
          enum: [register]
        providerId:
          type: string
          description: DID Ed25519 del provider — debe coincidir con el hello
        manifest:
          type: object
          description: Beacon (manifiesto) del provider. Ver schemas/beacon-*.schema.json (TASK-IDL-002)
        timestamp:
          type: integer
          format: int64
          description: Unix ms
        signature:
          type: string
          description: Firma Ed25519 en base64 de "providerId:timestamp:sha256hex(manifiesto canónico)"

    RegisteredMessage:
      type: object
      required: [type, leaseExpires, acceptedServices]
      properties:
        type:
          type: string
          enum: [registered]
        leaseExpires:
          type: integer
          format: int64
          description: Unix ms cuando vence el lease actual (se renueva con cada ping)
        acceptedServices:
          type: integer
          description: Número de capacidades (capabilities) aceptadas del manifiesto

    PingMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ping]
      description: Heartbeat (Pulse). El provider lo emite cada heartbeatSeconds para renovar el lease.

    PongMessage:
      type: object
      required: [type, timestamp]
      properties:
        type:
          type: string
          enum: [pong]
        timestamp:
          type: integer
          format: int64
          description: Unix ms del momento en que Atlas responde al ping

    FhsErrorCode:
      type: string
      enum:
        - NOT_IDENTIFIED
        - INVALID_MANIFEST
        - INVALID_SIGNATURE
        - UNSUPPORTED_VERSION
        - UPSTREAM_UNAVAILABLE
        - UPSTREAM_TIMEOUT
        - INVALID_ARGUMENTS
        - UNSUPPORTED_CAPABILITY
        - UNAUTHORIZED
        - CANCELLED
        - OVERLOADED
        - INTERNAL_ERROR
      description: Código semántico de error FHS. Quien consume debe poder tomar decisiones basándose solo en el código, sin parsear el campo message.

    ErrorMessage:
      type: object
      required: [type, code]
      properties:
        type:
          type: string
          enum: [error]
        code:
          $ref: "#/components/schemas/FhsErrorCode"
        message:
          type: string
          description: Descripción legible del error (opcional, no machine-readable)

    NodeService:
      type: object
      required: [kind, capabilities]
      properties:
        kind:
          type: string
          description: "Tipo de provider: star | satellite | nova | multi (ver docs/vocabulario.md)"
        capabilities:
          type: array
          items:
            type: string
          description: IDs de las capacidades ofrecidas por el nodo

    NodeOnlineMessage:
      type: object
      required: [type, providerId, providerName, services]
      properties:
        type:
          type: string
          enum: [node.online]
        providerId:
          type: string
          description: DID del provider que entró en Orbit
        providerName:
          type: string
          description: Nombre legible del provider (del manifiesto)
        services:
          type: array
          items:
            $ref: "#/components/schemas/NodeService"

    NodeLostMessage:
      type: object
      required: [type, providerId, providerName, services]
      properties:
        type:
          type: string
          enum: [node.lost]
        providerId:
          type: string
          description: DID del provider que perdió su lease o cerró la conexión
        providerName:
          type: string
          description: Nombre legible del provider
        services:
          type: array
          items:
            $ref: "#/components/schemas/NodeService"

    # ── Tipos base ────────────────────────────────────────────────────────
    CallerAuth:
      type: object
      required: [callerId, signature, timestamp]
      properties:
        callerId:
          type: string
          description: DID del nodo que origina la solicitud (did:key:...)
        signature:
          type: string
          description: Firma Ed25519 en base64 de `callerId:missionId:timestamp`
        timestamp:
          type: integer
          format: int64
          description: Unix ms del momento de firma

    ToolDefinition:
      type: object
      required: [name, description, inputSchema]
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          description: JSON Schema del parámetro de entrada

    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name, arguments]
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON serializado de los argumentos

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
          nullable: true
        toolCallId:
          type: string
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    # ── Mensajes del protocolo FHS ────────────────────────────────────────
    ChatRequestMessage:
      type: object
      required: [type, missionId, messages, timestamp, auth]
      properties:
        type:
          type: string
          enum: [chat.request]
        missionId:
          type: string
          description: UUID único de la misión/sesión de chat
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolDefinition"
        model:
          type: string
          description: Modelo LLM solicitado (opcional, el provider decide si lo acepta)
        timestamp:
          type: integer
          format: int64
        auth:
          $ref: "#/components/schemas/CallerAuth"

    ChatCancelMessage:
      type: object
      required: [type, missionId, timestamp]
      properties:
        type:
          type: string
          enum: [chat.cancel]
        missionId:
          type: string
        timestamp:
          type: integer
          format: int64

    ChatDeltaMessage:
      type: object
      required: [type, missionId, delta, timestamp]
      properties:
        type:
          type: string
          enum: [chat.delta]
        missionId:
          type: string
        delta:
          type: string
          description: Fragmento de texto generado
        timestamp:
          type: integer
          format: int64

    ChatCompletedMessage:
      type: object
      required: [type, missionId, content, timestamp]
      properties:
        type:
          type: string
          enum: [chat.completed]
        missionId:
          type: string
        content:
          type: string
          description: Respuesta completa generada
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        timestamp:
          type: integer
          format: int64

    ChatErrorMessage:
      type: object
      required: [type, missionId, error, timestamp]
      properties:
        type:
          type: string
          enum: [chat.error]
        missionId:
          type: string
        error:
          type: string
        timestamp:
          type: integer
          format: int64

    DispatchAckMessage:
      type: object
      required: [type, missionId, queuedAt]
      properties:
        type:
          type: string
          enum: [dispatch.ack]
        missionId:
          type: string
        queuedAt:
          type: integer
          format: int64

    ToolCallRequestMessage:
      type: object
      required: [type, missionId, toolCalls, timestamp]
      properties:
        type:
          type: string
          enum: [tool.call]
        missionId:
          type: string
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        timestamp:
          type: integer
          format: int64

    ToolCancelMessage:
      type: object
      required: [type, missionId, timestamp]
      properties:
        type:
          type: string
          enum: [tool.cancel]
        missionId:
          type: string
        timestamp:
          type: integer
          format: int64

    ToolCallResultMessage:
      type: object
      required: [type, missionId, toolCallId, result, timestamp]
      properties:
        type:
          type: string
          enum: [tool.result]
        missionId:
          type: string
        toolCallId:
          type: string
        result:
          type: string
          description: JSON serializado del resultado
        timestamp:
          type: integer
          format: int64

    ToolCallErrorMessage:
      type: object
      required: [type, missionId, toolCallId, error, timestamp]
      properties:
        type:
          type: string
          enum: [tool.error]
        missionId:
          type: string
        toolCallId:
          type: string
        error:
          type: string
        timestamp:
          type: integer
          format: int64

    ToolListRequestMessage:
      type: object
      required: [type, missionId, timestamp]
      properties:
        type:
          type: string
          enum: [tool.list]
        missionId:
          type: string
        timestamp:
          type: integer
          format: int64

    ToolListResponseMessage:
      type: object
      required: [type, missionId, tools, timestamp]
      properties:
        type:
          type: string
          enum: [tool.list.response]
        missionId:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolDefinition"
        timestamp:
          type: integer
          format: int64

  servers:
    navigator:
      host: "{navigator}"
      protocol: ws
      description: Navigator — Agent Runtime
      variables:
        navigator:
          default: "localhost:8090"
          description: Host y puerto del Navigator
    atlas:
      host: "{atlas}"
      protocol: ws
      description: Atlas — Registry
      variables:
        atlas:
          default: "localhost:8081"
          description: Host y puerto de Atlas
