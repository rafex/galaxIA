asyncapi: "3.0.0"

info:
  title: FHS Wire Protocol
  version: "0.5.0"
  description: |
    Federation of Sovereign Horizons (FHS) — protocolo de mensajería entre
    nodos federados en una red P2P descentralizada basada en libp2p.

    ## Arquitectura de red (DEC-P2P-001)

    La red FHS usa libp2p como capa P2P. No hay un registro central obligatorio.
    Atlas actúa únicamente como **bootstrap peer**: ayuda a nuevos nodos a unirse
    a la DHT Kademlia, pero no tiene autoridad sobre los demás nodos.

    ## Dos planos de mensajería

    ### 1. Stream directo FHS

    Protocolo libp2p: `/fhs/v1/0.1.0`
    Negociación con `Sec-WebSocket-Protocol`:

    | Subprotocol    | Frames  | Formato                        |
    |----------------|---------|-------------------------------|
    | `fhs.v1`       | binary  | LPP + Protobuf (primario, P2P) |
    | `fhs.v1.json`  | text    | JSON compat (solo desarrollo)  |

    En modo `fhs.v1`, cada frame binario es `[varint-length][Envelope bytes]`.
    Ver `idl/framing.md`. En modo JSON, el campo `type` actúa como discriminador.

    Todos los mensajes de stream viajan dentro de un `Envelope` con campos de routing:
    `messageId` (UUID), `sourcePeerId` (DID), `destPeerId` (DID),
    `timestamp` (anti-replay), `version`, `signature` (Ed25519 del envelope).

    ### 2. GossipSub (libp2p pubsub)

    Mensajes de broadcast en tópicos de GossipSub. No son Envelopes.
    Cada mensaje lleva su propia firma Ed25519.
    Ver `idl/gossipsub.md` para la especificación completa de cada tópico.

    | Tópico                       | Mensaje               | Dirección          |
    |------------------------------|-----------------------|--------------------|
    | `fhs/v1/nodes/advertise`     | NodeAdvertiseMessage  | Broadcast — todos  |
    | `fhs/v1/missions/offer`      | MissionOfferMessage   | Navigator → todos  |
    | `fhs/v1/missions/bid`        | MissionBidMessage     | Provider → todos   |
    | `fhs/v1/missions/assign`     | MissionAssignMessage  | Navigator → todos  |
    | `fhs/v1/reputation/update`   | ReputationUpdateMessage | Navigator → todos |

    ### 3. DHT Kademlia

    Registros persistidos en la DHT. No son mensajes — son records almacenados.

    | Key DHT                    | Record               | Quién publica    |
    |----------------------------|----------------------|------------------|
    | `{did}`                    | DhtBeaconRecord      | El nodo mismo    |
    | `reputation/{did}`         | DhtReputationRecord  | Navigators       |

    Ver `idl/gossipsub.md` y `docs/p2p.md` para detalles completos.

    ## Identidad y autenticación

    Cada nodo tiene un DID `did:key:z...` (Ed25519). La clave pública está embebida
    en el DID — verificación sin PKI externa. Todo mensaje (Envelope, GossipSub, DHT)
    lleva firma Ed25519 del emisor.

    Versión de referencia: @rafex/galaxia-fhs-protocol
    Repositorio: https://github.com/rafex/galaxIA-SDK
    Framing spec: idl/framing.md

  license:
    name: MIT
  contact:
    name: galaxIA
    url: https://github.com/rafex/galaxIA

defaultContentType: application/json

# ── Canales de stream directo FHS ────────────────────────────────────────────
# Los streams directos se establecen entre CUALQUIER par de nodos FHS.
# El protocolo libp2p /fhs/v1/0.1.0 negocia la conexión; WSS la transporta.

channels:
  # ── Stream: Portal ↔ Navigator ───────────────────────────────────────────
  /chat:
    address: wss://{navigator}/chat
    description: |
      Stream directo Portal↔Navigator para misiones de chat y control de agente.
      El Portal inicia con agent.start, envía chat.request / chat.cancel.
      Navigator responde con agent.status, star.selected, tool.selected,
      assistant.delta, assistant.completed, chat.error.
      Todos los mensajes viajan en Envelope (sourcePeerId = DID del emisor).
    messages:
      agentStart:
        $ref: "#/components/messages/AgentStartMessage"
      chatRequest:
        $ref: "#/components/messages/ChatRequestMessage"
      chatCancel:
        $ref: "#/components/messages/ChatCancelMessage"
      agentStatus:
        $ref: "#/components/messages/AgentStatusMessage"
      starSelected:
        $ref: "#/components/messages/StarSelectedMessage"
      toolSelected:
        $ref: "#/components/messages/ToolSelectedMessage"
      assistantDelta:
        $ref: "#/components/messages/AssistantDeltaMessage"
      assistantCompleted:
        $ref: "#/components/messages/AssistantCompletedMessage"
      chatError:
        $ref: "#/components/messages/ChatErrorMessage"
      error:
        $ref: "#/components/messages/ErrorMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]

  # ── Stream: Navigator ↔ Star (stream directo, post-assign) ───────────────
  /mission/chat:
    address: wss://{star}/mission/chat
    description: |
      Stream directo Navigator↔Star para ejecución de Mission de chat.
      Abierto DESPUÉS de que el Star gana un MissionBid via GossipSub.
      Navigator envía chat.request; Star responde con chat.delta / chat.completed.
      El Star puede emitir tool.call hacia Navigator si necesita Satellites.
      Todos los mensajes viajan en Envelope firmado.
    messages:
      chatRequest:
        $ref: "#/components/messages/ChatRequestMessage"
      chatCancel:
        $ref: "#/components/messages/ChatCancelMessage"
      chatDelta:
        $ref: "#/components/messages/ChatDeltaMessage"
      chatCompleted:
        $ref: "#/components/messages/ChatCompletedMessage"
      chatError:
        $ref: "#/components/messages/ChatErrorMessage"
      dispatchAck:
        $ref: "#/components/messages/DispatchAckMessage"
      toolCallRequest:
        $ref: "#/components/messages/ToolCallRequestMessage"
      toolListRequest:
        $ref: "#/components/messages/ToolListRequestMessage"
      error:
        $ref: "#/components/messages/ErrorMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]

  # ── Stream: Navigator ↔ Satellite (stream directo, post-assign) ──────────
  /mission/tool:
    address: wss://{satellite}/mission/tool
    description: |
      Stream directo Navigator↔Satellite para ejecución de tool.call.
      Abierto DESPUÉS de que el Satellite gana un MissionBid via GossipSub.
      Navigator envía tool.call / tool.cancel; Satellite responde con
      tool.result / tool.error.
      Los mensajes viajan en Envelope firmado.
    messages:
      toolCallRequest:
        $ref: "#/components/messages/ToolCallRequestMessage"
      toolCancel:
        $ref: "#/components/messages/ToolCancelMessage"
      toolCallResult:
        $ref: "#/components/messages/ToolCallResultMessage"
      toolCallError:
        $ref: "#/components/messages/ToolCallErrorMessage"
      toolListRequest:
        $ref: "#/components/messages/ToolListRequestMessage"
      toolListResponse:
        $ref: "#/components/messages/ToolListResponseMessage"
      dispatchAck:
        $ref: "#/components/messages/DispatchAckMessage"
      error:
        $ref: "#/components/messages/ErrorMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]

  # ── Stream: Handshake (cualquier par de nodos FHS) ───────────────────────
  /fhs:
    address: wss://{peer}/fhs
    description: |
      Handshake de establecimiento de stream FHS entre CUALQUIER par de nodos.
      Primer mensaje al abrir un stream libp2p /fhs/v1/0.1.0.
      El iniciador se presenta con su Beacon y multiaddrs.
      El receptor responde con handshake_ack y parámetros de sesión.
      Después del handshake: ping/pong para mantener el stream activo.
    messages:
      handshake:
        $ref: "#/components/messages/HandshakeMessage"
      handshakeAck:
        $ref: "#/components/messages/HandshakeAckMessage"
      ping:
        $ref: "#/components/messages/PingMessage"
      pong:
        $ref: "#/components/messages/PongMessage"
      error:
        $ref: "#/components/messages/ErrorMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]

  # ── GossipSub: fhs/v1/nodes/advertise ────────────────────────────────────
  /gossipsub/nodes/advertise:
    address: "fhs/v1/nodes/advertise"
    description: |
      Tópico GossipSub: presencia de nodos.
      Cada nodo publica NodeAdvertiseMessage periódicamente (según ttl_seconds).
      Reemplaza el modelo node.online / node.lost centralizado en Atlas.
      Un nodo que deja de anunciar se considera offline (TTL expirado).
      Todos los nodos se suscriben a este tópico para mantener una vista
      local del ecosistema de peers disponibles.
    messages:
      nodeAdvertise:
        $ref: "#/components/messages/NodeAdvertiseMessage"

  # ── GossipSub: fhs/v1/missions/offer ─────────────────────────────────────
  /gossipsub/missions/offer:
    address: "fhs/v1/missions/offer"
    description: |
      Tópico GossipSub: oferta de Mission por un Navigator.
      Navigator publica MissionOfferMessage cuando necesita un provider.
      Los providers elegibles (que tienen las capabilities requeridas y
      están disponibles) responden con MissionBidMessage en el tópico bid.
    messages:
      missionOffer:
        $ref: "#/components/messages/MissionOfferMessage"

  # ── GossipSub: fhs/v1/missions/bid ───────────────────────────────────────
  /gossipsub/missions/bid:
    address: "fhs/v1/missions/bid"
    description: |
      Tópico GossipSub: bids de providers en respuesta a una MissionOffer.
      Navigator recoge los bids hasta bid_deadline_ms y selecciona el mejor
      según: trust_level > reputation_score > estimated_latency_ms.
    messages:
      missionBid:
        $ref: "#/components/messages/MissionBidMessage"

  # ── GossipSub: fhs/v1/missions/assign ────────────────────────────────────
  /gossipsub/missions/assign:
    address: "fhs/v1/missions/assign"
    description: |
      Tópico GossipSub: Navigator confirma la asignación de una Mission.
      El provider ganador abre o acepta el stream directo del Navigator.
      Los demás providers que hicieron bid pueden liberar recursos reservados.
    messages:
      missionAssign:
        $ref: "#/components/messages/MissionAssignMessage"

  # ── GossipSub: fhs/v1/reputation/update ──────────────────────────────────
  /gossipsub/reputation/update:
    address: "fhs/v1/reputation/update"
    description: |
      Tópico GossipSub: actualización de reputación post-Mission.
      Navigator publica ReputationUpdateMessage al completar una Mission.
      Todos los nodos suscritos actualizan su caché local de reputación.
      Los nodos que mantienen DhtReputationRecord también usan este feed
      para actualizar el registro en la DHT.
    messages:
      reputationUpdate:
        $ref: "#/components/messages/ReputationUpdateMessage"

components:
  messages:
    # ── Handshake (stream directo) ────────────────────────────────────────────
    HandshakeMessage:
      name: handshake
      title: Handshake de establecimiento de stream FHS
      summary: |
        Nodo A → Nodo B. Primer mensaje al abrir stream /fhs/v1/0.1.0.
        El iniciador se presenta con Beacon y multiaddrs.
        En Ephemeral Satellites incluye DelegationToken.
      payload:
        $ref: "#/components/schemas/HandshakeMessage"

    HandshakeAckMessage:
      name: handshake_ack
      title: Confirmación de handshake
      summary: |
        Nodo B → Nodo A. Stream establecido. Devuelve parámetros de sesión.
      payload:
        $ref: "#/components/schemas/HandshakeAckMessage"

    PingMessage:
      name: ping
      title: Heartbeat (Pulse)
      summary: Emitido cada heartbeatSeconds para mantener el stream activo.
      payload:
        $ref: "#/components/schemas/PingMessage"

    PongMessage:
      name: pong
      title: Respuesta al Pulse
      summary: Responde a ping con server_timestamp para calcular RTT.
      payload:
        $ref: "#/components/schemas/PongMessage"

    ErrorMessage:
      name: error
      title: Error estandarizado FHS
      summary: Cualquier nodo → cualquier nodo. Código de error semántico.
      payload:
        $ref: "#/components/schemas/ErrorMessage"

    # ── Portal ↔ Navigator ────────────────────────────────────────────────────
    AgentStartMessage:
      name: agent.start
      title: Inicio de sesión de agente
      summary: Portal → Navigator. Inicia una sesión de agente con scope y modelo preferido.
      payload:
        $ref: "#/components/schemas/AgentStartMessage"

    AgentStatusMessage:
      name: agent.status
      title: Estado del agente
      summary: |
        Navigator → Portal. Estado del agente durante procesamiento.
        Incluye estados nuevos del ciclo GossipSub: offering, waiting_bid, assigning.
      payload:
        $ref: "#/components/schemas/AgentStatusMessage"

    StarSelectedMessage:
      name: star.selected
      title: Star seleccionado
      summary: Navigator → Portal. Informa qué Star ganó el bid para la Mission.
      payload:
        $ref: "#/components/schemas/StarSelectedMessage"

    ToolSelectedMessage:
      name: tool.selected
      title: Satellite y capability seleccionados
      summary: Navigator → Portal. Informa qué Satellite está siendo invocado.
      payload:
        $ref: "#/components/schemas/ToolSelectedMessage"

    AssistantDeltaMessage:
      name: assistant.delta
      title: Fragmento de respuesta (streaming)
      summary: Navigator → Portal. Fragmento de texto del agente en streaming.
      payload:
        $ref: "#/components/schemas/AssistantDeltaMessage"

    AssistantCompletedMessage:
      name: assistant.completed
      title: Respuesta completa con provenance
      summary: Navigator → Portal. Respuesta final con provenance de la Mission.
      payload:
        $ref: "#/components/schemas/AssistantCompletedMessage"

    # ── Chat (stream directo Navigator ↔ Star) ────────────────────────────────
    ChatRequestMessage:
      name: chat.request
      title: Solicitud de chat
      payload:
        $ref: "#/components/schemas/ChatRequestMessage"

    ChatCancelMessage:
      name: chat.cancel
      title: Cancelación de chat
      payload:
        $ref: "#/components/schemas/ChatCancelMessage"

    ChatDeltaMessage:
      name: chat.delta
      title: Fragmento de respuesta en streaming
      payload:
        $ref: "#/components/schemas/ChatDeltaMessage"

    ChatCompletedMessage:
      name: chat.completed
      title: Respuesta completa
      payload:
        $ref: "#/components/schemas/ChatCompletedMessage"

    ChatErrorMessage:
      name: chat.error
      title: Error en chat
      payload:
        $ref: "#/components/schemas/ChatErrorMessage"

    DispatchAckMessage:
      name: dispatch.ack
      title: Confirmación de recepción de Mission
      payload:
        $ref: "#/components/schemas/DispatchAckMessage"

    # ── Tool (stream directo Navigator ↔ Satellite) ───────────────────────────
    ToolCallRequestMessage:
      name: tool.call
      title: Solicitud de tool
      payload:
        $ref: "#/components/schemas/ToolCallRequestMessage"

    ToolCancelMessage:
      name: tool.cancel
      title: Cancelación de tool
      payload:
        $ref: "#/components/schemas/ToolCancelMessage"

    ToolCallResultMessage:
      name: tool.result
      title: Resultado de tool
      payload:
        $ref: "#/components/schemas/ToolCallResultMessage"

    ToolCallErrorMessage:
      name: tool.error
      title: Error en tool
      payload:
        $ref: "#/components/schemas/ToolCallErrorMessage"

    ToolListRequestMessage:
      name: tool.list
      title: Solicitud de lista de tools
      payload:
        $ref: "#/components/schemas/ToolListRequestMessage"

    ToolListResponseMessage:
      name: tool.list.response
      title: Lista de tools disponibles
      payload:
        $ref: "#/components/schemas/ToolListResponseMessage"

    # ── GossipSub — Presencia ─────────────────────────────────────────────────
    NodeAdvertiseMessage:
      name: node.advertise
      title: Anuncio de presencia de nodo
      summary: |
        Tópico fhs/v1/nodes/advertise. Publicado periódicamente por cada nodo.
        Reemplaza node.online / node.lost del modelo centralizado en Atlas.
        TTL basado en ttl_seconds: si deja de publicar → offline.
      payload:
        $ref: "#/components/schemas/NodeAdvertiseMessage"

    # ── GossipSub — Dispatch de Missions ──────────────────────────────────────
    MissionOfferMessage:
      name: mission.offer
      title: Oferta de Mission
      summary: |
        Tópico fhs/v1/missions/offer. Navigator publica qué capabilities necesita.
        Parte del flujo de dispatch descentralizado (DEC-P2P-001).
      payload:
        $ref: "#/components/schemas/MissionOfferMessage"

    MissionBidMessage:
      name: mission.bid
      title: Bid de provider para una Mission
      summary: |
        Tópico fhs/v1/missions/bid. Provider responde a una MissionOffer que puede satisfacer.
        Incluye reputación, latencia estimada y capabilities ofrecidas.
      payload:
        $ref: "#/components/schemas/MissionBidMessage"

    MissionAssignMessage:
      name: mission.assign
      title: Asignación de Mission a provider
      summary: |
        Tópico fhs/v1/missions/assign. Navigator confirma el bid ganador.
        Tras esto, Navigator abre stream directo con el provider asignado.
      payload:
        $ref: "#/components/schemas/MissionAssignMessage"

    # ── GossipSub — Reputación ────────────────────────────────────────────────
    ReputationUpdateMessage:
      name: reputation.update
      title: Actualización de reputación post-Mission
      summary: |
        Tópico fhs/v1/reputation/update. Navigator publica evaluación al completar Mission.
        Reemplaza el mission.feedback punto-a-punto con Atlas.
      payload:
        $ref: "#/components/schemas/ReputationUpdateMessage"

    # ── Ephemeral Satellite ───────────────────────────────────────────────────
    MissionFeedbackMessage:
      name: mission.feedback
      title: Feedback de Mission (stream directo, Ephemeral Satellite)
      summary: |
        Usado en stream directo cuando GossipSub no está disponible
        (ej. Ephemeral Satellite reportando directamente al Nodo Host).
        En GossipSub se usa ReputationUpdateMessage.
      payload:
        $ref: "#/components/schemas/MissionFeedbackMessage"

  schemas:
    # ── Envelope (frame raíz del stream directo, DEC-0087) ────────────────────
    Envelope:
      type: object
      required: [messageId, sourcePeerId, timestamp, version, signature, type]
      properties:
        messageId:
          type: string
          format: uuid
          description: UUID único por frame (deduplicación en redes P2P)
        sourcePeerId:
          type: string
          description: DID del nodo emisor (did:key:z...)
        destPeerId:
          type: string
          description: DID del destino; vacío solo en handshake inicial
        timestamp:
          type: integer
          format: int64
          description: Unix ms — anti-replay (ventana recomendada ±30 000 ms)
        version:
          type: string
          enum: ["1"]
        signature:
          type: string
          description: Ed25519 base64 de sha256(messageId:source:dest:timestamp:payload_bytes_hex)
        type:
          type: string
          description: Discriminador del payload en modo JSON

    # ── Handshake ─────────────────────────────────────────────────────────────
    HandshakeMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [fhsVersion, beacon]
          properties:
            type:
              type: string
              enum: [handshake]
            fhsVersion:
              type: string
            listenAddrs:
              type: array
              items:
                type: string
              description: Multiaddrs P2P con TLS — /ip4/.../tcp/.../tls/ws
            beacon:
              type: object
              description: Beacon completo del nodo. Ver schemas/beacon-*.schema.json
            delegationToken:
              $ref: "#/components/schemas/DelegationToken"
              description: Solo para Ephemeral Satellites (SPEC-EPHSAT-0001)

    HandshakeAckMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [fhsVersion, leaseSeconds, heartbeatSeconds, leaseExpires, acceptedServices]
          properties:
            type:
              type: string
              enum: [handshake_ack]
            fhsVersion:
              type: string
            leaseSeconds:
              type: integer
              description: Duración del lease del stream en segundos (default 30)
            heartbeatSeconds:
              type: integer
              description: Intervalo de ping recomendado (default 10)
            leaseExpires:
              type: integer
              format: int64
            acceptedServices:
              type: integer
            trustLevel:
              type: string
              enum: [standard, delegated, community, unverified]

    PingMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              type: string
              enum: [ping]

    PongMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [serverTimestamp]
          properties:
            type:
              type: string
              enum: [pong]
            serverTimestamp:
              type: integer
              format: int64

    FhsErrorCode:
      type: string
      enum:
        - NOT_IDENTIFIED
        - INVALID_MANIFEST
        - INVALID_SIGNATURE
        - UNSUPPORTED_VERSION
        - UPSTREAM_UNAVAILABLE
        - UPSTREAM_TIMEOUT
        - INVALID_ARGUMENTS
        - UNSUPPORTED_CAPABILITY
        - UNAUTHORIZED
        - CANCELLED
        - OVERLOADED
        - INTERNAL_ERROR
        - DELEGATION_INVALID
        - DELEGATION_EXPIRED
        - WASM_HASH_MISMATCH
        - PEER_UNREACHABLE
        - DHT_RECORD_INVALID
        - BID_TIMEOUT
        - BID_REJECTED

    ErrorMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [code]
          properties:
            type:
              type: string
              enum: [error]
            code:
              $ref: "#/components/schemas/FhsErrorCode"
            message:
              type: string

    # ── Portal ↔ Navigator ────────────────────────────────────────────────────
    AgentStartMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [sessionId]
          properties:
            type:
              type: string
              enum: [agent.start]
            sessionId:
              type: string
              format: uuid
            scope:
              type: string
              enum: [local, network, community, external]
            model:
              type: string

    AgentStatusMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, status]
          properties:
            type:
              type: string
              enum: [agent.status]
            missionId:
              type: string
            status:
              type: string
              enum: [thinking, offering, waiting_bid, assigning, calling_star, calling_satellite, streaming, completed, error]
              description: |
                thinking: agente procesando.
                offering: publicando MissionOffer en GossipSub.
                waiting_bid: esperando bids antes de bid_deadline_ms.
                assigning: seleccionando bid ganador y publicando MissionAssign.
                calling_star / calling_satellite: stream directo abierto.
                streaming / completed / error: estados finales.

    StarSelectedMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, providerId, model]
          properties:
            type:
              type: string
              enum: [star.selected]
            missionId:
              type: string
            providerId:
              type: string
              description: DID del Star que ganó el bid
            model:
              type: string

    ToolSelectedMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, providerId, capabilityId]
          properties:
            type:
              type: string
              enum: [tool.selected]
            missionId:
              type: string
            providerId:
              type: string
            capabilityId:
              type: string

    AssistantDeltaMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, delta]
          properties:
            type:
              type: string
              enum: [assistant.delta]
            missionId:
              type: string
            delta:
              type: string

    ProvenanceInfo:
      type: object
      required: [providerId, model]
      properties:
        providerId:
          type: string
        model:
          type: string
        completionTokens:
          type: integer
        toolProviderIds:
          type: array
          items:
            type: string
        dataExported:
          type: boolean
        jurisdiction:
          type: string
        starReputation:
          type: number
          description: Score de reputación del Star al momento del dispatch (0.0 - 1.0)

    AssistantCompletedMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, content]
          properties:
            type:
              type: string
              enum: [assistant.completed]
            missionId:
              type: string
            content:
              type: string
            provenance:
              $ref: "#/components/schemas/ProvenanceInfo"

    # ── Chat ──────────────────────────────────────────────────────────────────
    ToolDefinition:
      type: object
      required: [name, description, inputSchema]
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object

    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name, arguments]
          properties:
            name:
              type: string
            arguments:
              type: string

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
          nullable: true
        toolCallId:
          type: string
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    ChatRequestMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, messages]
          properties:
            type:
              type: string
              enum: [chat.request]
            missionId:
              type: string
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            tools:
              type: array
              items:
                $ref: "#/components/schemas/ToolDefinition"
            model:
              type: string

    ChatCancelMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId]
          properties:
            type:
              type: string
              enum: [chat.cancel]
            missionId:
              type: string

    ChatDeltaMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, delta]
          properties:
            type:
              type: string
              enum: [chat.delta]
            missionId:
              type: string
            delta:
              type: string

    ChatCompletedMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, content]
          properties:
            type:
              type: string
              enum: [chat.completed]
            missionId:
              type: string
            content:
              type: string
            toolCalls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"

    ChatErrorMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, error]
          properties:
            type:
              type: string
              enum: [chat.error]
            missionId:
              type: string
            error:
              type: string

    DispatchAckMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, queuedAt]
          properties:
            type:
              type: string
              enum: [dispatch.ack]
            missionId:
              type: string
            queuedAt:
              type: integer
              format: int64

    # ── Tool ──────────────────────────────────────────────────────────────────
    ToolCallRequestMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, toolCalls]
          properties:
            type:
              type: string
              enum: [tool.call]
            missionId:
              type: string
            toolCalls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"

    ToolCancelMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId]
          properties:
            type:
              type: string
              enum: [tool.cancel]
            missionId:
              type: string

    ToolCallResultMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, toolCallId, result]
          properties:
            type:
              type: string
              enum: [tool.result]
            missionId:
              type: string
            toolCallId:
              type: string
            result:
              type: string

    ToolCallErrorMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, toolCallId, error]
          properties:
            type:
              type: string
              enum: [tool.error]
            missionId:
              type: string
            toolCallId:
              type: string
            error:
              type: string

    ToolListRequestMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId]
          properties:
            type:
              type: string
              enum: [tool.list]
            missionId:
              type: string

    ToolListResponseMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, tools]
          properties:
            type:
              type: string
              enum: [tool.list.response]
            missionId:
              type: string
            tools:
              type: array
              items:
                $ref: "#/components/schemas/ToolDefinition"

    # ── GossipSub — Presencia ─────────────────────────────────────────────────
    # Estos schemas NO extienden Envelope — son mensajes GossipSub autofirmados.
    NodeAdvertiseMessage:
      type: object
      required: [did, beacon, multiaddrs, timestamp, ttlSeconds, signature]
      properties:
        did:
          type: string
          pattern: "^did:key:z"
        beacon:
          type: object
          description: Beacon completo del nodo (JSON)
        multiaddrs:
          type: array
          items:
            type: string
          description: Multiaddrs P2P del nodo (solo wss://)
        timestamp:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          description: Tiempo de vida del anuncio (default 60)
        ephemeral:
          type: boolean
        delegatedBy:
          type: string
          description: DID del Nodo Host; solo si ephemeral = true
        trustLevel:
          type: string
          enum: [standard, delegated, community, unverified]
        signature:
          type: string
          description: Ed25519 base64 de (did + sha256(beacon) + timestamp + ttlSeconds)

    # ── GossipSub — Dispatch ──────────────────────────────────────────────────
    MissionOfferMessage:
      type: object
      required: [missionId, navigatorDid, navigatorMultiaddrs, missionType, requiredCapabilities, bidDeadlineMs, timestamp, signature]
      properties:
        missionId:
          type: string
          format: uuid
        navigatorDid:
          type: string
          pattern: "^did:key:z"
        navigatorMultiaddrs:
          type: array
          items:
            type: string
        missionType:
          type: string
          enum: [chat, tool_call, agent]
        requiredCapabilities:
          type: array
          items:
            type: string
        preferredModel:
          type: string
        scope:
          type: string
          enum: [local, network, community, external]
        bidDeadlineMs:
          type: integer
          format: int64
          description: Unix ms límite para recibir bids
        timestamp:
          type: integer
          format: int64
        signature:
          type: string

    MissionBidMessage:
      type: object
      required: [missionId, providerDid, providerMultiaddrs, providerType, offeredCapabilities, timestamp, signature]
      properties:
        missionId:
          type: string
          format: uuid
        providerDid:
          type: string
          pattern: "^did:key:z"
        providerMultiaddrs:
          type: array
          items:
            type: string
        providerType:
          type: string
          enum: [star, satellite, nova]
        offeredCapabilities:
          type: array
          items:
            type: string
        offeredModel:
          type: string
        reputationScore:
          type: number
          minimum: 0
          maximum: 1
          description: Score de reputación del provider (0.0 - 1.0)
        estimatedLatencyMs:
          type: integer
          description: Latencia estimada basada en carga actual
        trustLevel:
          type: string
          enum: [standard, delegated, community, unverified]
        timestamp:
          type: integer
          format: int64
        signature:
          type: string

    MissionAssignMessage:
      type: object
      required: [missionId, navigatorDid, assignedProvider, timestamp, signature]
      properties:
        missionId:
          type: string
          format: uuid
        navigatorDid:
          type: string
          pattern: "^did:key:z"
        assignedProvider:
          type: string
          pattern: "^did:key:z"
          description: DID del provider ganador del bid
        timestamp:
          type: integer
          format: int64
        signature:
          type: string

    # ── GossipSub — Reputación ────────────────────────────────────────────────
    ReputationUpdateMessage:
      type: object
      required: [missionId, providerDid, navigatorDid, latencyMs, success, timestamp, signature]
      properties:
        missionId:
          type: string
          format: uuid
        providerDid:
          type: string
          pattern: "^did:key:z"
        navigatorDid:
          type: string
          pattern: "^did:key:z"
        latencyMs:
          type: number
        success:
          type: boolean
        errorCode:
          type: string
          description: FhsErrorCode como string; vacío si success = true
        delegatedBy:
          type: string
          description: DID del Nodo Host; solo para Ephemeral Satellites
        timestamp:
          type: integer
          format: int64
        signature:
          type: string

    # ── DHT Records ───────────────────────────────────────────────────────────
    DhtBeaconRecord:
      type: object
      required: [did, beacon, multiaddrs, publishedAt, expiresAt, fhsVersion, signature]
      properties:
        did:
          type: string
          pattern: "^did:key:z"
        beacon:
          type: object
        multiaddrs:
          type: array
          items:
            type: string
        publishedAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        fhsVersion:
          type: string
        signature:
          type: string

    DhtReputationRecord:
      type: object
      required: [providerDid, evaluatorDid, score, lastUpdated, signature]
      properties:
        providerDid:
          type: string
          pattern: "^did:key:z"
        evaluatorDid:
          type: string
          pattern: "^did:key:z"
        score:
          type: number
          minimum: 0
          maximum: 1
        missionsSuccess:
          type: integer
        missionsFailed:
          type: integer
        avgLatencyMs:
          type: number
        lastUpdated:
          type: integer
          format: int64
        signature:
          type: string

    # ── Ephemeral Satellite ───────────────────────────────────────────────────
    DelegationToken:
      type: object
      required: [issuer, subject, capabilities, wasmHash, expiresAt, signature]
      properties:
        issuer:
          type: string
          pattern: "^did:key:z"
        subject:
          type: string
          pattern: "^did:key:z"
        capabilities:
          type: array
          items:
            type: string
        wasmHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        expiresAt:
          type: integer
          format: int64
        signature:
          type: string

    MissionFeedbackMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, providerDid, latencyMs, success]
          properties:
            type:
              type: string
              enum: [mission.feedback]
            missionId:
              type: string
              format: uuid
            providerDid:
              type: string
            latencyMs:
              type: number
            success:
              type: boolean
            errorCode:
              type: string
            delegatedBy:
              type: string

  servers:
    navigator:
      host: "{navigator}"
      protocol: wss
      description: Navigator — Agent Runtime
      variables:
        navigator:
          default: "localhost:8444"
    atlas:
      host: "{atlas}"
      protocol: wss
      description: Atlas — Bootstrap Peer (no es registro central)
      variables:
        atlas:
          default: "localhost:8443"
    star:
      host: "{star}"
      protocol: wss
      description: Star — LLM Provider
      variables:
        star:
          default: "localhost:43111"
    satellite:
      host: "{satellite}"
      protocol: wss
      description: Satellite — Tool Provider
      variables:
        satellite:
          default: "localhost:43112"
