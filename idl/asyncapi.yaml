asyncapi: "3.0.0"

info:
  title: FHS Wire Protocol
  version: "0.2.0"
  description: |
    Federation of Sovereign Horizons (FHS) — protocolo de mensajería entre
    nodos federados: Atlas (Registry), Navigator (Agent Runtime) y
    Providers (Star, Satellite, Nova).

    ## Modos de transporte (DEC-0086)

    Negociación con `Sec-WebSocket-Protocol`:

    | Subprotocol    | Frames  | Formato                        |
    |----------------|---------|-------------------------------|
    | `fhs.v1`       | binary  | LPP + Protobuf (primario, P2P) |
    | `fhs.v1.json`  | text    | JSON compat                    |

    En modo `fhs.v1`, cada frame binario es `[varint-length][Envelope bytes]`.
    Ver `idl/framing.md`. En modo JSON, el campo `type` actúa como discriminador.

    ## Envelope P2P (DEC-0087)

    Todos los mensajes viajan dentro de un `Envelope` con campos de routing:
    `messageId` (UUID), `sourcePeerId` (DID), `destPeerId` (DID, opcional),
    `timestamp` (anti-replay), `version`, `signature` (Ed25519 del envelope).

    La autenticación es por Envelope: `sourcePeerId` identifica al emisor y
    `signature` autentica el frame. No hay `CallerAuth` separado.

    ## Ciclo de vida (DEC-0087)

    Flujo 2-step: `handshake` → `handshake_ack` → `ping/pong` (cada heartbeatSeconds).
    Reemplaza el flujo anterior de 4 pasos (hello/welcome/register/registered).

    Versión de referencia: @rafex/galaxia-fhs-protocol
    Repositorio de tipos: https://github.com/rafex/galaxIA-SDK
    Framing spec: idl/framing.md

  license:
    name: MIT
  contact:
    name: galaxIA
    url: https://github.com/rafex/galaxIA

defaultContentType: application/json

channels:
  # ── WebSocket: Cliente → Navigator (misiones de chat) ────────────────────
  /chat:
    address: ws://{navigator}/chat
    description: |
      Canal de misiones de chat. El cliente envía chat.request / chat.cancel.
      El Navigator responde con chat.delta (streaming), chat.completed, chat.error,
      tool.call y tool.list. También puede recibir tool.result y tool.list.response.
    messages:
      chatRequest:
        $ref: "#/components/messages/ChatRequestMessage"
      chatCancel:
        $ref: "#/components/messages/ChatCancelMessage"
      toolCallResult:
        $ref: "#/components/messages/ToolCallResultMessage"
      toolCallError:
        $ref: "#/components/messages/ToolCallErrorMessage"
      toolListResponse:
        $ref: "#/components/messages/ToolListResponseMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]
              description: "fhs.v1: binario LPP+Protobuf (P2P). fhs.v1.json: texto JSON (compat)."

  # ── WebSocket: Navigator → Cliente (respuestas de misión) ────────────────
  /chat/stream:
    address: ws://{navigator}/chat
    messages:
      chatDelta:
        $ref: "#/components/messages/ChatDeltaMessage"
      chatCompleted:
        $ref: "#/components/messages/ChatCompletedMessage"
      chatError:
        $ref: "#/components/messages/ChatErrorMessage"
      toolCallRequest:
        $ref: "#/components/messages/ToolCallRequestMessage"
      toolListRequest:
        $ref: "#/components/messages/ToolListRequestMessage"

  # ── WebSocket: Provider ↔ Atlas (ciclo de vida P2P) ───────────────────────
  /register:
    address: ws://{atlas}/register
    description: |
      Canal de ciclo de vida de un provider con Atlas (DEC-0087).
      Flujo 2-step: handshake → handshake_ack → ping/pong (cada heartbeatSeconds).
      Una vez en Orbit el canal recibe dispatch.ack y tool.cancel.
      Todos los mensajes viajan en un Envelope firmado.
    messages:
      handshake:
        $ref: "#/components/messages/HandshakeMessage"
      handshakeAck:
        $ref: "#/components/messages/HandshakeAckMessage"
      ping:
        $ref: "#/components/messages/PingMessage"
      pong:
        $ref: "#/components/messages/PongMessage"
      error:
        $ref: "#/components/messages/ErrorMessage"
      dispatchAck:
        $ref: "#/components/messages/DispatchAckMessage"
      toolCancel:
        $ref: "#/components/messages/ToolCancelMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]
              description: "fhs.v1: binario LPP+Protobuf (P2P). fhs.v1.json: texto JSON (compat)."

  # ── WebSocket: Atlas → Navigator (notificaciones de topología) ───────────
  /atlas/nodes:
    address: ws://{atlas}/nodes
    description: |
      Notificaciones internas que Atlas emite hacia Navigator cuando
      un provider entra en Orbit (node.online) o pierde su lease (node.lost).
    messages:
      nodeOnline:
        $ref: "#/components/messages/NodeOnlineMessage"
      nodeLost:
        $ref: "#/components/messages/NodeLostMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]
              description: "fhs.v1: binario LPP+Protobuf (P2P). fhs.v1.json: texto JSON (compat)."

  # ── WebSocket: Atlas ↔ Atlas (gossip P2P, DEC-0086) ───────────────────────
  /atlas/gossip:
    address: ws://{atlas}/gossip
    description: |
      Canal de gossip entre instancias Atlas. Permite que múltiples Atlas sincronicen
      sus routing tables sin coordinator central, formando una malla federada P2P.
      El Atlas iniciador envía atlas.announce; el receptor responde con atlas.sync.
      sourcePeerId en el Envelope identifica al Atlas emisor.
    messages:
      atlasAnnounce:
        $ref: "#/components/messages/AtlasAnnounceMessage"
      atlasSync:
        $ref: "#/components/messages/AtlasSyncMessage"
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              enum: [fhs.v1, fhs.v1.json]
              description: "fhs.v1: binario LPP+Protobuf (P2P). fhs.v1.json: texto JSON (compat)."

components:
  messages:
    # ── Ciclo de vida P2P (Provider ↔ Atlas, DEC-0087) ───────────────────────
    HandshakeMessage:
      name: handshake
      title: Handshake del provider con Atlas
      summary: |
        Provider → Atlas. Primer mensaje tras abrir el WebSocket. Lleva el Beacon
        firmado y los multiaddrs P2P del nodo. Reemplaza hello+register.
      payload:
        $ref: "#/components/schemas/HandshakeMessage"

    HandshakeAckMessage:
      name: handshake_ack
      title: Confirmación de handshake
      summary: |
        Atlas → Provider. El provider está en Orbit. Lleva parámetros de lease.
        Reemplaza welcome+registered.
      payload:
        $ref: "#/components/schemas/HandshakeAckMessage"

    PingMessage:
      name: ping
      title: Heartbeat (Pulse) del provider
      summary: Provider → Atlas. Enviado cada heartbeatSeconds para renovar el lease.
      payload:
        $ref: "#/components/schemas/PingMessage"

    PongMessage:
      name: pong
      title: Respuesta al Pulse
      summary: Atlas → Provider. Responde a ping con el server_timestamp para calcular RTT.
      payload:
        $ref: "#/components/schemas/PongMessage"

    ErrorMessage:
      name: error
      title: Error estandarizado
      summary: Cualquier nodo → cualquier nodo. Código de error semántico FHS.
      payload:
        $ref: "#/components/schemas/ErrorMessage"

    # ── Gossip P2P (Atlas ↔ Atlas, DEC-0086) ─────────────────────────────────
    AtlasAnnounceMessage:
      name: atlas.announce
      title: Anuncio de providers en Orbit
      summary: Atlas → Atlas. Anuncia los providers en Orbit para sincronizar routing tables.
      payload:
        $ref: "#/components/schemas/AtlasAnnounceMessage"

    AtlasSyncMessage:
      name: atlas.sync
      title: Respuesta de sincronización entre Atlas
      summary: Atlas → Atlas. Devuelve el estado completo de providers en respuesta a atlas.announce.
      payload:
        $ref: "#/components/schemas/AtlasSyncMessage"

    # ── Mensajes de Chat ──────────────────────────────────────────────────────
    ChatRequestMessage:
      name: chat.request
      title: Solicitud de chat
      payload:
        $ref: "#/components/schemas/ChatRequestMessage"

    ChatCancelMessage:
      name: chat.cancel
      title: Cancelación de chat en curso
      payload:
        $ref: "#/components/schemas/ChatCancelMessage"

    ChatDeltaMessage:
      name: chat.delta
      title: Fragmento de respuesta en streaming
      payload:
        $ref: "#/components/schemas/ChatDeltaMessage"

    ChatCompletedMessage:
      name: chat.completed
      title: Respuesta de chat completa
      payload:
        $ref: "#/components/schemas/ChatCompletedMessage"

    ChatErrorMessage:
      name: chat.error
      title: Error en el procesamiento del chat
      payload:
        $ref: "#/components/schemas/ChatErrorMessage"

    DispatchAckMessage:
      name: dispatch.ack
      title: Confirmación de dispatch a un provider
      payload:
        $ref: "#/components/schemas/DispatchAckMessage"

    # ── Mensajes de Tool ──────────────────────────────────────────────────────
    ToolCallRequestMessage:
      name: tool.call
      title: Solicitud de ejecución de tool
      payload:
        $ref: "#/components/schemas/ToolCallRequestMessage"

    ToolCancelMessage:
      name: tool.cancel
      title: Cancelación de tool en ejecución
      payload:
        $ref: "#/components/schemas/ToolCancelMessage"

    ToolCallResultMessage:
      name: tool.result
      title: Resultado de ejecución de tool
      payload:
        $ref: "#/components/schemas/ToolCallResultMessage"

    ToolCallErrorMessage:
      name: tool.error
      title: Error en la ejecución de tool
      payload:
        $ref: "#/components/schemas/ToolCallErrorMessage"

    ToolListRequestMessage:
      name: tool.list
      title: Solicitud de lista de tools disponibles
      payload:
        $ref: "#/components/schemas/ToolListRequestMessage"

    ToolListResponseMessage:
      name: tool.list.response
      title: Lista de tools disponibles
      payload:
        $ref: "#/components/schemas/ToolListResponseMessage"

    # ── Notificaciones internas ───────────────────────────────────────────────
    NodeOnlineMessage:
      name: node.online
      title: Notificación de provider conectado
      summary: Atlas → Navigator. Un provider entró en Orbit tras handshake exitoso.
      payload:
        $ref: "#/components/schemas/NodeOnlineMessage"

    NodeLostMessage:
      name: node.lost
      title: Notificación de provider perdido
      summary: Atlas → Navigator. Un provider perdió su lease o cerró la conexión.
      payload:
        $ref: "#/components/schemas/NodeLostMessage"

  schemas:
    # ── Envelope (frame raíz del protocolo, DEC-0087) ─────────────────────────
    # En modo JSON, los campos del Envelope van al nivel raíz del objeto
    # junto con los campos del payload y el discriminador `type`.
    Envelope:
      type: object
      required: [messageId, sourcePeerId, timestamp, version, signature, type]
      properties:
        messageId:
          type: string
          format: uuid
          description: UUID único por frame (deduplicación en redes P2P)
        sourcePeerId:
          type: string
          description: DID del nodo emisor (did:key:z...)
        destPeerId:
          type: string
          description: DID del destino; ausente o vacío = broadcast / cualquier Atlas
        timestamp:
          type: integer
          format: int64
          description: Unix ms — anti-replay (ventana recomendada ±30 000 ms)
        version:
          type: string
          enum: ["1"]
          description: Versión del protocolo FHS
        signature:
          type: string
          description: Ed25519 base64 de sha256(messageId:source:dest:timestamp:payload_bytes_hex)
        type:
          type: string
          description: Discriminador del payload en modo JSON (ej. "handshake", "chat.request")

    # ── Ciclo de vida P2P (DEC-0087) ─────────────────────────────────────────
    HandshakeMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [fhsVersion, beacon]
          properties:
            type:
              type: string
              enum: [handshake]
            fhsVersion:
              type: string
              description: Versión del protocolo FHS que soporta este nodo (ej. "1")
            listenAddrs:
              type: array
              items:
                type: string
              description: Multiaddrs P2P del nodo (ej. /ip4/1.2.3.4/tcp/8081/ws)
            beacon:
              type: object
              description: Beacon (manifiesto completo del nodo). Ver schemas/beacon-*.schema.json

    HandshakeAckMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [fhsVersion, leaseSeconds, heartbeatSeconds, leaseExpires, acceptedServices]
          properties:
            type:
              type: string
              enum: [handshake_ack]
            fhsVersion:
              type: string
              description: Versión del protocolo acordada para esta sesión
            leaseSeconds:
              type: integer
              description: Duración del lease en segundos (default 30)
            heartbeatSeconds:
              type: integer
              description: Intervalo de ping recomendado en segundos (default 10)
            leaseExpires:
              type: integer
              format: int64
              description: Unix ms cuando vence el lease actual
            acceptedServices:
              type: integer
              description: Número de capabilities aceptadas del Beacon

    PingMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              type: string
              enum: [ping]
          description: Heartbeat (Pulse). El provider lo emite cada heartbeatSeconds.

    PongMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [serverTimestamp]
          properties:
            type:
              type: string
              enum: [pong]
            serverTimestamp:
              type: integer
              format: int64
              description: Unix ms cuando Atlas procesa el ping (para calcular RTT)

    FhsErrorCode:
      type: string
      enum:
        - NOT_IDENTIFIED
        - INVALID_MANIFEST
        - INVALID_SIGNATURE
        - UNSUPPORTED_VERSION
        - UPSTREAM_UNAVAILABLE
        - UPSTREAM_TIMEOUT
        - INVALID_ARGUMENTS
        - UNSUPPORTED_CAPABILITY
        - UNAUTHORIZED
        - CANCELLED
        - OVERLOADED
        - INTERNAL_ERROR
      description: Código semántico de error FHS. Quien consume puede tomar decisiones solo con el código.

    ErrorMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [code]
          properties:
            type:
              type: string
              enum: [error]
            code:
              $ref: "#/components/schemas/FhsErrorCode"
            message:
              type: string
              description: Descripción legible del error (opcional)

    # ── Gossip P2P (Atlas ↔ Atlas, DEC-0086) ─────────────────────────────────
    # atlasId viene de Envelope.sourcePeerId; timestamp y signature del Envelope.
    AtlasAnnounceMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [providerIds]
          properties:
            type:
              type: string
              enum: [atlas.announce]
            providerIds:
              type: array
              items:
                type: string
              description: DIDs de providers actualmente en Orbit en este Atlas

    AtlasSyncMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [providers]
          properties:
            type:
              type: string
              enum: [atlas.sync]
            providers:
              type: array
              items:
                $ref: "#/components/schemas/NodeOnlineMessage"
              description: Estado completo de cada provider en Orbit

    # ── Tipos base ────────────────────────────────────────────────────────────
    ToolDefinition:
      type: object
      required: [name, description, inputSchema]
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          description: JSON Schema del parámetro de entrada

    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name, arguments]
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON serializado de los argumentos

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
          nullable: true
        toolCallId:
          type: string
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    # ── Mensajes de misión — Chat ─────────────────────────────────────────────
    # callerId = Envelope.sourcePeerId; auth = Envelope.signature; timestamp = Envelope.timestamp
    ChatRequestMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, messages]
          properties:
            type:
              type: string
              enum: [chat.request]
            missionId:
              type: string
              description: UUID único de la misión de chat
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            tools:
              type: array
              items:
                $ref: "#/components/schemas/ToolDefinition"
            model:
              type: string
              description: Modelo LLM solicitado (opcional)

    ChatCancelMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId]
          properties:
            type:
              type: string
              enum: [chat.cancel]
            missionId:
              type: string

    ChatDeltaMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, delta]
          properties:
            type:
              type: string
              enum: [chat.delta]
            missionId:
              type: string
            delta:
              type: string
              description: Fragmento de texto generado

    ChatCompletedMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, content]
          properties:
            type:
              type: string
              enum: [chat.completed]
            missionId:
              type: string
            content:
              type: string
            toolCalls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"

    ChatErrorMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, error]
          properties:
            type:
              type: string
              enum: [chat.error]
            missionId:
              type: string
            error:
              type: string

    DispatchAckMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, queuedAt]
          properties:
            type:
              type: string
              enum: [dispatch.ack]
            missionId:
              type: string
            queuedAt:
              type: integer
              format: int64
              description: Unix ms cuando la misión entró en la cola (timestamp de negocio)

    # ── Mensajes de misión — Tool ─────────────────────────────────────────────
    ToolCallRequestMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, toolCalls]
          properties:
            type:
              type: string
              enum: [tool.call]
            missionId:
              type: string
            toolCalls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"

    ToolCancelMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId]
          properties:
            type:
              type: string
              enum: [tool.cancel]
            missionId:
              type: string

    ToolCallResultMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, toolCallId, result]
          properties:
            type:
              type: string
              enum: [tool.result]
            missionId:
              type: string
            toolCallId:
              type: string
            result:
              type: string
              description: JSON serializado del resultado

    ToolCallErrorMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, toolCallId, error]
          properties:
            type:
              type: string
              enum: [tool.error]
            missionId:
              type: string
            toolCallId:
              type: string
            error:
              type: string

    ToolListRequestMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId]
          properties:
            type:
              type: string
              enum: [tool.list]
            missionId:
              type: string

    ToolListResponseMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [missionId, tools]
          properties:
            type:
              type: string
              enum: [tool.list.response]
            missionId:
              type: string
            tools:
              type: array
              items:
                $ref: "#/components/schemas/ToolDefinition"

    # ── Notificaciones internas (Atlas → Navigator) ───────────────────────────
    NodeService:
      type: object
      required: [kind, capabilities]
      properties:
        kind:
          type: string
          description: "Tipo de provider: star | satellite | nova | multi"
        capabilities:
          type: array
          items:
            type: string
          description: IDs de las capabilities ofrecidas

    NodeOnlineMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [providerId, providerName, services]
          properties:
            type:
              type: string
              enum: [node.online]
            providerId:
              type: string
              description: DID del provider que entró en Orbit
            providerName:
              type: string
            services:
              type: array
              items:
                $ref: "#/components/schemas/NodeService"

    NodeLostMessage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [providerId, providerName, services]
          properties:
            type:
              type: string
              enum: [node.lost]
            providerId:
              type: string
              description: DID del provider que perdió su lease
            providerName:
              type: string
            services:
              type: array
              items:
                $ref: "#/components/schemas/NodeService"

  servers:
    navigator:
      host: "{navigator}"
      protocol: ws
      description: Navigator — Agent Runtime
      variables:
        navigator:
          default: "localhost:8090"
          description: Host y puerto del Navigator
    atlas:
      host: "{atlas}"
      protocol: ws
      description: Atlas — Registry / Bootstrap Peer
      variables:
        atlas:
          default: "localhost:8081"
          description: Host y puerto de Atlas
